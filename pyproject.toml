[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "arf"
version = "1.0.0-alpha.0"
description = "ARF — AI Resources & Runtime Framework (Python binding)"
requires-python = ">=3.11"
authors = [
    {name = "WangXie", email = "997793170@qq.com"}
]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23"]

[tool.maturin]
manifest-path = "py-arf/Cargo.toml"
module-name = "arf._arf"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = ["-v", "--strict-markers", "--tb=short"]