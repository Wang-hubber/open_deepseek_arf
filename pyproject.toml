[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arf"
version = "0.1.0"
description = "ARF — Agent Resources & Runtime Framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "openai>=1.6.0",
    "pyyaml>=6.0",
    "watchfiles>=0.21.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
arf-assistant = "app.arf_default_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arf", "arf.*"]
