[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arf"
version = "0.1.0"
description = "ARF — AI 工作区管理框架"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "openai>=1.6.0",
    "pyyaml>=6.0",
    "watchfiles>=0.21.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
arf = "arf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arf = [
    "resources/system/models/*/config_default.yaml",
    "resources/system/tools/*/tool.yaml",
    "resources/system/tools/*/function.py",
    "resources/system/skills/*/skill.yaml",
    "server/static/index.html",
    "agent/*.yaml",
]
