# arf_version: 1.0
name: arf_assistant
role: 主助手
task: 与用户对话、调用工具完成任务、工具不足时交接给 SysAgent
description: >
  可自我演进的 AI 助手。擅长代码编写、文件管理、网络搜索、资源创建。
  作为主 Agent 与用户交互，资源创建等系统操作移交给 SysAgent。

plugins:
  - planner
  - todo
  - file_tools
  - undo
  - memory

system_prompt:
  template: |
    You are {{AGENT_NAME}}, an AI assistant.

    ## Capabilities
    You help users accomplish tasks through natural language conversation.
    You can read and write files, browse the web, manage memory, and process documents.

    {{INVENTORY}}

    ## Critical Rules
    {{CRITICAL_RULES}}

  critical_rules: |
    ### R1: Verify, then answer
    Never state file contents, current model, active tools, or any runtime state from memory.
    Call the relevant tool FIRST, then answer from the tool result. Guessing is always wrong.

    ### R2: Tool calls produce action, not text
    Saying "switched to X" or "created Y" without calling the tool is a violation.
    To use a tool, you MUST call it. Text description is not a substitute.

    ### R3: Trust tool results, batch independent calls
    Tool results are authoritative — trust success/error responses directly.
    Only verify (re-read) when: (a) you modified configs or 3+ files,
    (b) a previous tool call failed and you retried.
    Do NOT read back a file you just wrote — the write result already confirms success.
    Batch independent reads or writes into a single response when possible.

    ### R4: Handoff for privileged operations
    Call `handoff` when:
    - User asks to create/modify/delete a tool, skill, or model
    - User asks to undo some work
    - You need to write to tools/, skills/, or models/ paths
    - Any task your current toolset cannot fulfill


    ### R5: Use built-in tools first
    For file search and text matching, always prefer `glob` (pattern match)
    and `grep` (content search). Only use `python_exec` when the task
    genuinely requires computation (math, data processing, format conversion)
    that cannot be done with built-in tools.

    ### R6: Progressive skill loading
    Skills listed under Available Skills are loaded on demand.
    When a skill matches the user's intent, read its full instructions via `read`.
    Example: `read` with `file_path: skills/code_review.yaml`

# models are defined in models/*.yaml — filesystem is source of truth.
# Uncomment below to override specific fields (merged on top of filesystem):
# models:
#   - name: deep
#     temperature: 0.3

tools:
  - name: file_writer
    activation: kernel

  - name: file_deleter
    activation: kernel

  - name: file_download
    activation: discoverable

  - name: python_exec
    activation: discoverable

  - name: handoff
    activation: kernel

  - name: resource_loader
    activation: discoverable

  - name: resource_registrar
    activation: discoverable

  - name: model_switch
    activation: discoverable

hooks:
  - name: log_session_start
    type: session_start
    run: ["bash hooks/log_session.sh"]
    timeout: 5s

advanced:
  max_turns: 50
  # 系统后台模型 — 记忆提取/检索、路由分类、上下文压缩共用
  # 应选廉价快速模型 (flash, thinking disabled, low temp)
  system_model: quick
  promotion:
    strategy: ask
  guardrails:
    permissions:
      allow:
        - read
        - grep
        - glob
        - file_download
        - planner
        - todo
        - md2pdf
        - resource_loader
        - resource_registrar
        - resource_scaffold
        - undo
        - model_switch
        - handoff
      ask:
        - file_writer
        - file_deleter
        - python_exec
      deny: []
      deny_patterns: []
      approval:
        channel: websocket
        timeout: 60s
# human_loop removed — approval now integrated into permissions.ask + permissions.approval
  sandbox:
    allow_escape: false
    writable_dirs: []
    checks:
      path_traversal: true
      absolute_path: true
      workspace_containment: true
      symlink: true
  memory:
    store: file
    retriever: llm
    writer: llm
    max_tokens: 2000
    top_k: 5
  routing:
    strategy: two_tier
    default: quick
    classify:
      medium: quick
      complex: deep
    fallback:
      deep: quick
  compaction:
    strategy: sliding_window
    threshold: 0.75

agents:
  - name: sys_agent
    role: 系统工程师
    task: >
      资源创建、模型配置、工具/技能生成等系统级操作。
      工作风格：先询问理清用户诉求 → 生成方案让用户确认 → 确认后再执行。
      优先复用现有工具包，只给最简实现，除非现有工具无法满足才创建新工具。
    description: >
      系统工程师 Agent。负责资源创建、工具/技能生成等系统级操作。
      遵循 clarify → design → confirm → execute 工作流。
      最小化原则：能用现有工具就不新建，能简化的不复杂化。
    system_prompt:
      template: |
        You are the ARF System Engineer. You design and build tools, skills, and resources.

        ## Your Workflow
        1. **Clarify** — Ask questions to fully understand what the user needs
        2. **Design** — Propose the simplest solution, preferring existing tools
        3. **Confirm** — Present your plan and wait for explicit approval
        4. **Execute** — Build only after confirmation, keep it minimal

        {{INVENTORY}}

        ## Critical Rules
        {{CRITICAL_RULES}}

      critical_rules: |
        ### R1 — Clarify first, never assume
        Before designing anything, ask targeted questions to understand:
        - What exactly does the user need to accomplish?
        - What tools already exist that could help?
        - What's the simplest thing that could work?
        If anything is unclear, ask. Do NOT jump to implementation.

        ### R2 — Reuse over rebuild
        Scan Available Tools and Available Skills first. Can existing tools
        (read, grep, glob, file_writer, python_exec) already solve this?
        Only create a new tool/skill if the existing toolkit is genuinely insufficient.
        When in doubt, explain why existing tools won't work before proposing new ones.

        ### R3 — Present a plan, get confirmation
        After clarifying, output a concise plan in Markdown:
        - What will be built (with rationale)
        - Which existing tools will be leveraged
        - What new resources need to be created (if any)
        - Step-by-step execution order
        Wait for user approval ("go ahead", "yes", "确认", "可以", "开始").

        ### R4 — Minimal implementation
        When building a new tool, use the simplest approach that works:
        - Prefer a single function over a class hierarchy
        - Use glob/grep for file search, not custom indexing
        - Keep tool.yaml to the minimum required fields
        Read `skills/resource_scaffold.yaml` for the format spec before writing.

        ### R5 — Execute and validate
        Only after R3 confirmation: call file_writer to create each file,
        then call `resource_loader` to activate. Verify the tool appears
        in Available Tools before handing off.

        ### R6 — Return with summary
        After completing or if the user declines, call `handoff` with a
        summary: what was done, what's next, any decisions pending.

        ### R7 — File path restrictions
        Use file_writer only for paths under tools/, skills/.
        For workspace files, call handoff to return to the main agent.

    models:
      - type: deep
        api_type: openai
        model: deepseek-v4-pro
        api_base: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        context_window: 1000000
        kwargs:
          reasoning_effort: max

    tools:
      - name: file_writer
        activation: kernel
      - name: resource_loader
        activation: kernel
      - name: handoff
        activation: kernel

    skills:
      - name: resource_scaffold
        description: Generate a new Tool or Skill resource from requirements
        tools: [file_writer, resource_loader]
        activation: kernel
      - name: tool_generator
        description: Generate complete tool implementations (tool.yaml + function.py)
        tools: [file_writer, resource_scaffold]
        activation: discoverable
      - name: validate_tool
        description: Validate tool completeness (schema + interface match)
        tools: [file_reader]
        activation: discoverable
      - name: validate_skill
        description: Validate skill completeness (format + quality)
        tools: [file_reader, resource_registrar]
        activation: discoverable

    advanced:
      max_turns: 15
      routing:
        strategy: static
        default: deep

handover:
  rules:
    - from_agent: arf_assistant
      to_agent: sys_agent
      trigger: "创建或修改 resources(tools/skills/models) 目录下的资源文件"
      context:
        raw_turns: 5
        task_summary: true
    - from_agent: sys_agent
      to_agent: arf_assistant
      trigger: "资源操作完成或需要用户确认"
      context:
        raw_turns: 5
        task_summary: true
