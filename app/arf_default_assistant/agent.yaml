# arf_version: 1.0
name: arf_assistant
role: 主助手
task: 与用户对话、调用工具完成任务、工具不足时交接给 SysAgent
description: >
  可自我演进的 AI 助手。擅长代码编写、文件管理、网络搜索、资源创建。
  作为主 Agent 与用户交互，资源创建等系统操作移交给 SysAgent。

system_prompt:
  template: |
    You are {{AGENT_NAME}}, an AI assistant.

    ## Capabilities
    You help users accomplish tasks through natural language conversation.
    You can read and write files, browse the web, manage memory, and process documents.

    {{INVENTORY}}

    ## Critical Rules
    {{CRITICAL_RULES}}

  critical_rules: |
    ### R1: Verify, then answer
    Never state file contents, current model, active tools, or any runtime state from memory.
    Call the relevant tool FIRST, then answer from the tool result. Guessing is always wrong.

    ### R2: Tool calls produce action, not text
    Saying "switched to X" or "created Y" without calling the tool is a violation.
    To use a tool, you MUST call it. Text description is not a substitute.

    ### R3: Verify after action
    After calling a tool that changes state, verify the result.
    If the tool says it succeeded, report success. If it failed, analyze and retry.

    ### R4: Handoff for privileged operations
    Call `handoff_to_sys` when:
    - User asks to create/modify/delete a tool, skill, or model
    - User asks to undo some work
    - You need to write to tools/, skills/, or models/ paths
    - Any task your current toolset cannot fulfill


    ### R5: Progressive skill loading
    Skills listed under Available Skills are loaded on demand.
    When a skill matches the user's intent, read its full instructions via `file_reader`.
    Example: `file_reader` with `operation: read` and `path: skills/code_review.yaml`

# models are defined in models/*.yaml — filesystem is source of truth.
# Uncomment below to override specific fields (merged on top of filesystem):
# models:
#   - name: deep
#     temperature: 0.3

tools:
  - name: file_reader
    description: 读取文件内容或列出目录
    parameters: {type: object, properties: {path: {type: string, description: 文件路径}, operation: {type: string, enum: [read, list], default: read}}, required: [path]}
    activation: kernel

  - name: file_writer
    description: 写入文件（创建或覆盖）
    parameters: {type: object, properties: {path: {type: string}, content: {type: string}}, required: [path, content]}
    activation: kernel

  - name: file_deleter
    description: 软删除文件（重命名为 .deleted 后缀）
    parameters: {type: object, properties: {path: {type: string}}, required: [path]}
    activation: kernel

  - name: file_download
    description: 生成工作区文件的下载链接
    parameters: {type: object, properties: {path: {type: string}}, required: [path]}
    activation: discoverable

  - name: web_search
    description: 搜索互联网（DuckDuckGo）
    parameters: {type: object, properties: {query: {type: string}}, required: [query]}
    activation: kernel

  - name: web_fetch
    description: 获取网页内容（HTTP GET）
    parameters: {type: object, properties: {url: {type: string}}, required: [url]}
    activation: kernel

  - name: python_exec
    description: 执行 Python 代码片段
    parameters: {type: object, properties: {code: {type: string}}, required: [code]}
    activation: discoverable

  - name: handoff_to_sys
    description: 将资源创建/修改操作移交给 SysAgent
    parameters: {type: object, properties: {task: {type: string, description: 任务描述}, context: {type: string, description: 任务上下文}}, required: [task]}
    activation: kernel

  - name: resource_loader
    description: 动态加载/激活工具或技能
    parameters: {type: object, properties: {name: {type: string}, type: {type: string, enum: [tool, skill]}}, required: [name, type]}
    activation: discoverable

  - name: resource_registrar
    description: 查询已注册资源的配置状态和依赖关系
    parameters: {type: object}
    activation: discoverable

  - name: undo
    description: 撤销最近的对话轮次（状态 + 文件双回滚）
    parameters: {type: object, properties: {steps: {type: integer, default: 1}}}
    activation: kernel

  - name: model_switch
    description: 切换当前对话使用的模型
    parameters: {type: object, properties: {model: {type: string}}, required: [model]}
    activation: discoverable

advanced:
  max_turns: 50
  memory:
    store: file
    workspace: ./memory
    retriever: llm
    writer: llm
    max_tokens: 2000
    top_k: 5
    model: quick
    temperature: 0.3
    thinking_enabled: false
  routing:
    strategy: two_tier
    default: quick
    classify:
      medium: quick
      complex: deep
    fallback:
      deep: quick
  compaction:
    strategy: sliding_window
    threshold: 0.75

agents:
  - name: sys_agent
    role: 系统工程师
    task: 资源创建、模型配置、工具/技能生成等系统级操作
    description: 处理资源创建、模型配置、工具/技能生成等系统级操作
    system_prompt:
      template: |
        You are the ARF System Engineer. You create and orchestrate tools, skills, and models.

        {{INVENTORY}}

        ## Critical Rules
        {{CRITICAL_RULES}}

      critical_rules: |
        ### Gate 1 — Design
        Read `skills/resource_scaffold.yaml` for the format spec.
        Present the design before writing. Wait for user approval ("go ahead", "yes", "确认").
        Do NOT call file_writer yet.

        ### Gate 2 — Write
        Only after explicit approval, call file_writer to create each file.

        ### Gate 3 — Validate
        Read `skills/validate_tool.yaml` or `skills/validate_skill.yaml` and follow its checklist.

        ### Gate 4 — Activate
        Call `resource_loader` to activate the new resource.

        ### File Writer Path Restrictions
        You CAN use file_writer for paths under tools/, skills/.
        But for user workspace files (uploads/, output/), call handoff_to_sys back.

    models:
      - name: deep
        api_type: openai
        model: deepseek-v4-pro
        api_base: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        context_window: 1000000
        kwargs:
          reasoning_effort: max

    tools:
      - name: file_reader
        activation: kernel
      - name: file_writer
        activation: kernel
      - name: file_deleter
        activation: kernel
      - name: resource_loader
        activation: kernel
      - name: resource_scaffold
        activation: kernel
      - name: resource_registrar
        activation: kernel
      - name: web_fetch
        activation: kernel

    skills:
      - name: resource_scaffold
        description: Generate a new Tool or Skill resource from requirements
        tools: [file_writer, resource_loader]
        activation: kernel
      - name: tool_generator
        description: Generate complete tool implementations (tool.yaml + function.py)
        tools: [file_writer, resource_scaffold]
        activation: discoverable
      - name: skill_generator
        description: Generate skill definitions (skill.yaml)
        tools: [file_writer]
        activation: discoverable
      - name: validate_tool
        description: Validate tool completeness (schema + interface match)
        tools: [file_reader]
        activation: discoverable
      - name: validate_skill
        description: Validate skill completeness (format + quality)
        tools: [file_reader, resource_registrar]
        activation: discoverable

    advanced:
      max_turns: 15
      routing:
        strategy: static
        default: deep

handover:
  rules:
    - from_agent: arf_assistant
      to_agent: sys_agent
      trigger: "创建或修改 resources(tools/skills/models) 目录下的资源文件"
    - from_agent: sys_agent
      to_agent: arf_assistant
      trigger: "资源操作完成或需要用户确认"
