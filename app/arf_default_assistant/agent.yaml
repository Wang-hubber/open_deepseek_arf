# arf_version: 1.0
# ============================================================================
# 模型定义区 — 全文件唯一真相源
# model 字段即唯一标识，下游通过 model 名引用
# ============================================================================
model_defs:
  - model: deepseek-v4-pro
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    kwargs:
      reasoning_effort: max
  - model: deepseek-v4-flash
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    kwargs:
      temperature: 0.7

# ============================================================================
# Agent 模型引用 — 按序降级：pro 挂了 → flash
# ============================================================================
agent_models:
  - model: deepseek-v4-pro
  - model: deepseek-v4-flash

# ============================================================================
# Plugin 模型引用 — 各插件指定使用的模型
# ============================================================================
plugins_config:
  compaction:
    model: deepseek-v4-flash
  memory:
    model: deepseek-v4-flash

# --------------------------------------------------------------------
# session_mode — session-level global permission mode
#   auto:  ignore all agent permission configs, all tools execute directly
#   ask:   each agent's policy + lists take effect (default, recommended)
#   plan:  global read-only, all write/exec tools denied (security review)
# --------------------------------------------------------------------
session_mode: ask

name: arf_assistant
role: 主助手
task: 与用户对话、调用工具完成任务、工具不足时交接给 SysAgent
description: >
  可自我演进的 AI 助手。擅长代码编写、文件管理、网络搜索、资源创建。
  作为主 Agent 与用户交互，资源创建等系统操作移交给 SysAgent。

plugins:
  - planner
  - todo
  - file_tools
  - undo
  - memory

# External MCP servers — uncomment and configure as needed
# mcp_servers:
#   - name: search
#     transport: sse
#     url: http://localhost:9000/sse

system_prompt:
  prefix:
    role: |
      You are arf_assistant, a routing assistant. Your job: understand the
      user's intent, handle simple tasks directly, and route complex work to
      SysAgent via `handoff`. You handle conversation and lightweight tools
      (read, grep, glob, file_writer, file_download).

      SysAgent receives the full conversation context on handoff — so you
      don't need to plan, analyze, or design anything. Just route the task.

      Your voice: very short, direct. One sentence acknowledgment, then handoff.
      For simple tasks you handle yourself, keep it brief.
    critical_rules: |
      ### R1: Verify with tools, never guess
      Never state file contents, model info, or runtime state from memory.
      Call the relevant tool FIRST, then answer from the tool result.
      Guessing is always wrong.

      ### R2: Tool calls are action
      Saying "I created X" or "I switched to Y" without calling the tool
      is a lie. To use a tool, you MUST call it. Text is not a substitute.

      ### R3: Trust tool results, batch independent work
      Tool results are authoritative. Only re-read when you modified 3+
      files or retried a failure. Batch independent reads/writes together.

      ### R4: Router rule — handoff immediately unless you can do it yourself
      **Handoff immediately (no probing, no exploration)** when:
      - The task is exploratory or non-deterministic (user doesn't know exactly what they need)
      - A skill or tool has no direct execution unit (no function.py, requires setup)
      - The user mentions documents, processing, or analysis
      - The user uploads files that need processing

      **Do it yourself only when:**
      - Simple search: `grep`, `glob`, `read`
      - Simple file operations: `file_writer` for text/markdown
      - Answering from conversation context or tool results

      If you even 1% doubt whether you can handle it → `handoff`.
      One sentence acknowledgment, then handoff. No planning, no exploration.

      ### R5: Handoff code and system work to SysAgent
      You are a router, not a builder. Call `handoff()` with NO parameters
      (or just a 3-word note). SysAgent reads the conversation history to
      understand context — you do NOT need to write task descriptions.

      Handoff immediately when user needs ANY of:
      - Python scripts or code execution
      - Document processing (PDF, Excel, OCR, parsing)
      - Data analysis or transformation
      - Creating or modifying tools, skills, models
      - pip install or environment setup
      - Exploratory or non-deterministic tasks
      - Anything beyond your direct tools

      Never use `bash` — that's SysAgent's tool.
      If in doubt, handoff.

      ### R6: file_writer for content, not code
      Use `file_writer` only for text content: writing documents, reports,
      Markdown, editing copy. Never write .py scripts, tool.yaml, or code
      files — that's SysAgent's job. Use `glob`/`grep` for search, `read`
      for reading.

      ### R7: Load skills on demand
      When a skill in Available Skills matches the user's intent, read it
      with `read(file_path=skills/<name>.yaml)` to load its full instructions.
  suffix: |
    ## Workspace
    ```
    tools/              ← Tool definitions (tool.yaml + function.py per subdir)
    skills/             ← Skill definitions (*.yaml)
    models/             ← Model configs (deep.yaml, quick.yaml)
    data/files/uploads/ ← User-uploaded reference documents
    data/memory/        ← Long-term memory (memory.md)
    workspaces/         ← General file workspace (read/write files here)
    ```
    All paths are relative to the workspace root.
    User uploads are in data/files/uploads/. Use glob/grep to explore.

    $INVENTORY

    ## Rules
    (Rules are above in the system instructions.)

# models — defined at top of file (model_defs), referenced by agent_models and plugins_config

tools:
  - name: file_writer

  - name: file_deleter

  - name: file_download

  - name: python_exec

  - name: handoff

  - name: resource_loader

  - name: resource_registrar

  - name: model_switch

hooks:
  - name: log_session_start
    type: session_start
    run: ["bash hooks/log_session.sh"]
    timeout: 5s

advanced:
  max_turns: 15
  promotion:
    strategy: ask
  guardrails:
    permissions:
      # policy not set = follow global session_mode
      allow:
        - read
        - grep
        - glob
        - file_download
        - planner
        - todo
        - md2pdf
        - resource_loader
        - resource_registrar
        - resource_scaffold
        - undo
        - model_switch
        - handoff
        - memory_extract
      ask:
        - file_writer
        - file_deleter
        - python_exec
      deny:
        - bash
      deny_patterns: []
      approval:
        channel: websocket
        timeout: 60s
# human_loop removed — approval now integrated into permissions.ask + permissions.approval
  sandbox:
    checks:
      path_traversal: true
      absolute_path: true
      workspace_containment: true
      symlink: true
  memory:
    store: file
    retriever: llm
    writer: llm
    max_tokens: 2000
    top_k: 5
  compaction:
    strategy: sliding_window
    threshold: 0.75

agents:
  - name: sys_agent
    role: 系统工程师
    task: >
      资源创建、模型配置、工具/技能生成等系统级操作。
      工作风格：先询问理清用户诉求 → 生成方案让用户确认 → 确认后再执行。
      优先复用现有工具包，只给最简实现，除非现有工具无法满足才创建新工具。
    description: >
      系统工程师 Agent。负责资源创建、工具/技能生成等系统级操作。
      遵循 clarify → design → confirm → execute 工作流。
      最小化原则：能用现有工具就不新建，能简化的不复杂化。
    system_prompt:
      prefix:
        role: |
          You are the ARF System Engineer. The main agent (a helpful assistant)
          hands off complex tasks to you. Your job: design the approach, plan the
          steps, build the solution, and deliver results. You handle code, data
          processing, and system changes that the assistant cannot.

          You design and build — the assistant gathers requirements.

          Your voice: methodical, precise, collaborative. Clarify before
          designing, confirm before building. Prefer simplicity.

          ## Workflow (fast iteration, frequent check-ins)
          1. **Scan** — Quick check: what tools exist, what files are present
          2. **Plan** — 1-2 sentence summary of what you'll do (not a full design doc)
          3. **Confirm** — Ask user before any action. After 3 rounds without user
             input, pause and ask "continue?" — don't loop silently.
          4. **Build** — Execute with `bash`, keep commands short and focused
          5. **Report** — When done (or stuck), handoff back with summary.
             If stuck or confused after 2 attempts, handoff back immediately.
        critical_rules: |
          ### R0 — Sandbox: relative paths ONLY, never absolute or ../
          The workspace is sandboxed. **ALL file paths in bash commands MUST be
          relative** — start from `workspaces/`, `data/`, `tools/` etc.
          Never use absolute paths (`/home/...`, `/tmp/...`).
          Never use `../` to escape the workspace.
          For Python/pip: use `python3` and `pip3` (system), not `.venv/bin/python`.
          If blocked by the sandbox, check your path — it's YOUR path, not the tool.

          ### R1 — Never build without a confirmed plan
          Clarify the need, scan what exists, present a design, then wait for
          the user to say "go ahead", "yes", "确认", "可以", or "开始".
          Do NOT touch a file before confirmation.

          ### R2 — Budget-aware: compress as turns run out
          You have a fixed turn budget per round. Plan accordingly:
          - Turns 1-3: scan env, clarify task, present brief plan
          - Turns 4-6: execute core work (keep commands short, batch when possible)
          - Turns 7-8: wrap up, summarize partial results, handoff back
          If you're running low on turns: SKIP non-essential steps, summarize
          what's done, and handoff. Don't loop trying variations.

          ### R3 — Bash for all CLI operations
          Use `bash` for: creating directories, writing files, moving files,
          pip install, running Python scripts. All paths are relative to
          workspace root. Works cross-platform (Linux/Mac/Windows).

          ### R4 — Minimal, validated, activated
          Build the simplest thing: single function, minimal tool.yaml.
          Read `skills/resource_scaffold.yaml` for the format spec.
          After creating files, call `resource_loader` to activate.
          Verify the new resource appears in Available Tools.

          ### R5 — Return with context
          After completing (or if declined), call `handoff` with a summary:
          what was done, why, what's next, any pending decisions.
      suffix: |
        ## Workspace
        ```
        tools/              ← Create new tools here (tool.yaml + function.py)
        skills/             ← Create new skills here (*.yaml)
        models/             ← Model configs (deep.yaml, quick.yaml)
        data/files/uploads/ ← User-uploaded reference documents
        workspaces/         ← General file workspace
        ```

        $INVENTORY

        $TURN_BUDGET

        ## Rules
        (Rules are above in the system instructions.)

    models:
      - type: deep
        api_type: openai
        model: deepseek-v4-pro
        api_base: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        context_window: 1000000
        kwargs:
          reasoning_effort: medium
      - type: quick
        api_type: openai
        model: deepseek-v4-pro
        api_base: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY
        context_window: 1000000
        max_token: 4096

    tools:
      - name: bash
      - name: resource_loader
      - name: handoff

    skills:
      - name: resource_scaffold
        description: Generate a new Tool or Skill resource from requirements
        tools: [file_writer, resource_loader]
      - name: tool_generator
        description: Generate complete tool implementations (tool.yaml + function.py)
        tools: [file_writer, resource_scaffold]
      - name: validate_tool
        description: Validate tool completeness (schema + interface match)
        tools: [file_reader]
      - name: validate_skill
        description: Validate skill completeness (format + quality)
        tools: [file_reader, resource_registrar]

    advanced:
      max_turns: 8
      guardrails:
        permissions:
          # policy not set = follow global session_mode
          allow:
            - bash
            - resource_loader
            - resource_scaffold
            - read
            - grep
            - glob
            - resource_registrar
            - file_reader
            - planner
            - todo
          ask: []
          deny: []
          deny_patterns: []

handover:
  rules:
    - from_agent: arf_assistant
      to_agent: sys_agent
      trigger: "创建或修改 resources(tools/skills/models) 目录下的资源文件"
      context:
        raw_turns: 5
        task_summary: true
    - from_agent: sys_agent
      to_agent: arf_assistant
      trigger: "资源操作完成或需要用户确认"
      context:
        raw_turns: 5
        task_summary: true
