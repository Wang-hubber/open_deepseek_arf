name: debug
description: Systematic debugging of errors and unexpected behavior
prompt: |
  # Debug

  You encountered an issue. Follow a systematic debugging approach:

  ## Step 1: Reproduce
  - What exactly happened vs. what was expected?
  - Can you reproduce the issue reliably?

  ## Step 2: Isolate
  - Identify the component or layer where the bug originates
  - Check inputs, outputs, and intermediate state
  - Use available tools to inspect relevant files, data, or configuration

  ## Step 3: Hypothesize
  - List possible root causes
  - Rank them by likelihood

  ## Step 4: Test
  - For each hypothesis, construct a minimal test
  - Use python_exec or file manipulation to validate

  ## Step 5: Fix
  - Apply the minimal change needed
  - Verify the fix resolves the issue
  - Consider if the same bug pattern exists elsewhere

  ## Key rules:
  - Never guess — test each hypothesis
  - Change one thing at a time
  - Document what you find for future reference
tools:
  - file_reader
  - file_writer
  - python_exec
  - web_search
activation: discoverable
