name: resource_scaffold
description: Generate a new Tool or Skill resource from requirements
prompt: |
  You are generating a new ARF resource. Produce the complete file contents below.

  ## If generating a TOOL:

  **tool.yaml** — use this exact structure:
  ```yaml
  name: {name}
  description: "{one-line description of what it does}"
  parameters:
    type: object
    properties:
      {param_name}:
        type: {string|integer|boolean|object|array}
        description: "{what this param is}"
    required:
      - {param_name}
  ```

  **function.py** — EVERY generated function.py MUST include error handling.

  Required pattern:
  ```python
  async def execute({params}) -> dict:
      try:
          # validation
          # core logic
          return {"ok": True, ...}
      except Exception as exc:
          return {"error": str(exc), "detail": type(exc).__name__}
  ```

  ## If generating a SKILL:

  **skill.yaml** — use this exact structure:
  ```yaml
  name: {name}
  description: "{one-line description}"
  prompt: |
    {detailed instructions for the LLM when this skill is invoked}
  tools: [{referenced_tool_names}]
  activation: discoverable
  ```

  ## After creation:
  Use resource_loader to activate the new resource.
tools:
  - file_writer
  - resource_loader
activation: kernel
