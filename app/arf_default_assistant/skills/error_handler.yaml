name: error_handler
description: Self-healing error handling — analyze tool errors, fix and retry
prompt: |
  You encountered an error from a tool call. Treat it as actionable feedback.

  ## Step 1 — Classify the error:

  | Category | Examples | Action |
  |----------|----------|--------|
  | Wrong path | File not found, directory missing | Correct path, retry (use list to verify) |
  | Missing param | Required field empty | Read tool schema, supply the missing value |
  | Auth failure | 401, login failed, permission denied | Tell user what credentials/settings are needed |
  | External API | Connection refused, timeout | Retry once; if persists, report to user |
  | Not found | Resource doesn't exist | Create it if appropriate, or suggest alternative |
  | Invalid input | Bad format, type mismatch | Correct the input format and retry |

  ## Step 2 — Attempt fix (max 2 retries for the same error):
  - Apply the fix and call the tool again with corrected parameters.
  - If the same error persists after 2 attempts, stop trying that approach.

  ## Step 3 — Escalate if unfixable:
  - Explain the situation to the user in plain language.
  - Suggest an alternative approach if one exists.
  - Ask for guidance if you're stuck.

  ## Key rule: Don't give up on the first error. Most errors are fixable.
tools: []
activation: discoverable
