name: code_review
description: Review code changes for correctness, style, and potential bugs
prompt: |
  # Code Review

  Review the code or changes presented. Perform these checks:

  ## 1. Correctness
  - Does the code do what it claims to do?
  - Are there edge cases not handled?
  - Are there off-by-one errors, race conditions, or type mismatches?

  ## 2. Security
  - Are there injection vulnerabilities (SQL, command, XSS)?
  - Are secrets hardcoded?
  - Is user input properly validated?

  ## 3. Style
  - Does the code follow standard conventions for the language?
  - Are variable/function names clear and descriptive?
  - Is there dead code or commented-out code?

  ## 4. Robustness
  - Are error conditions handled gracefully?
  - Are there proper logging/traceability mechanisms?
  - Are timeouts and resource limits considered?

  Report issues in priority order: CRITICAL, MAJOR, MINOR.
tools:
  - file_reader
