name: md2pdf
description: Convert Markdown files to PDF via HTML pipeline
parameters:
  type: object
  properties:
    files:
      type: array
      items:
        type: string
      description: "Markdown file paths relative to workspace (e.g. ['doc/readme.md'])"
    output_dir:
      type: string
      description: "Output directory for PDF files (default: same as input file)"
    paper:
      type: string
      enum: ["A4", "Letter"]
      description: "Paper size (default: A4)"
  required:
    - files
execution:
  sandbox: inherit
  timeout: 120s
activation: kernel
