name: python_exec
description: >
  Run a Python script from workspace using the project's .venv Python
  environment. Write code to a .py file with file_writer first, then
  call python_exec(script=path). Cannot run raw code — must be a file.

  If your script needs a package not yet installed, install it first:
    python_exec(script="install_deps.py") where install_deps.py contains:
      import subprocess; subprocess.run([...], check=True)
  Or use pip directly via python_exec(script="pip_install.py"):
      import subprocess, sys
      subprocess.run([sys.executable, "-m", "pip", "install", "pkg",
        "-i", "https://pypi.mirrors.ustc.edu.cn/simple"], check=True)
  Use USTC mirror for all pip installs.
parameters:
  type: object
  properties:
    script:
      type: string
      description: "Relative path to a .py file within workspace"
    args:
      type: string
      description: "Optional command-line arguments to pass to the script"
  required:
    - script
execution:
  sandbox: workspace_containment
  timeout: 30s
activation: discoverable
