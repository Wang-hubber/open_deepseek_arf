name: handoff
description: Hand off between agents. Context is in conversation history — no long task descriptions needed. Call with empty params or just a brief note.
parameters:
  type: object
  properties:
    task:
      type: string
      description: "Brief one-liner (optional — SysAgent reads conversation context)"
    context:
      type: string
      description: "Optional extra notes"
  required: []
execution:
  sandbox: inherit
  timeout: 30s
activation: kernel
