name: manage_hooks
description: Manage session lifecycle hooks (list, enable, disable)
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [list, enable, disable]
      description: "Operation: list, enable, or disable a hook"
    hook_name:
      type: string
      description: "Name of the hook to enable/disable"
  required:
    - action
execution:
  sandbox: inherit
  timeout: 30s
activation: discoverable
