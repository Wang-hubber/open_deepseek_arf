name: web_search
description: Search the internet using DuckDuckGo, returns titles, snippets, and URLs
parameters:
  type: object
  properties:
    query:
      type: string
      description: "Search query, supports Chinese and English"
    max_results:
      type: integer
      description: "Maximum results to return, default 10, max 20"
  required:
    - query
execution:
  sandbox: inherit
  timeout: 30s
activation: kernel
