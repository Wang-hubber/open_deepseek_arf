name: resource_registrar
description: Query registered resource configuration status and dependencies
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [check, list_pending, check_deps]
      description: "Action to perform: check, list_pending, or check_deps"
    resource_type:
      type: string
      enum: [tool, skill, model]
      description: "Resource type for check/check_deps actions"
    name:
      type: string
      description: "Resource name for check/check_deps actions"
  required:
    - action
execution:
  sandbox: inherit
  timeout: 30s
activation: discoverable
