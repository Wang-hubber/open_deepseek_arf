name: bash
description: >
  Execute a shell command within the workspace directory.
  Cross-platform: uses bash/sh on Linux/Mac, cmd on Windows.
  Commands run in the workspace root. Use for file operations,
  git, pip install, and other CLI tasks. Output truncated at 8000 chars.
parameters:
  type: object
  properties:
    command:
      type: string
      description: "Shell command to execute (single line or multiline)"
  required:
    - command
execution:
  sandbox: workspace_containment
  timeout: 30s
activation: kernel
