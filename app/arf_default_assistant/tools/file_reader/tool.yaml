name: file_reader
description: Read file contents or list directory entries
parameters:
  type: object
  properties:
    operation:
      type: string
      enum: [read, list]
      description: "read (file contents), list (directory listing)"
    path:
      type: string
      description: "File or directory path relative to workspace root"
  required:
    - operation
    - path
execution:
  sandbox: inherit
  timeout: 30s
activation: kernel
