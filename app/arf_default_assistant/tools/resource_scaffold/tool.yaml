name: resource_scaffold
description: Create directory skeleton for a new tool or skill
parameters:
  type: object
  properties:
    type:
      type: string
      enum: [tool, skill]
      description: "Type of resource to create"
    name:
      type: string
      description: "Resource name"
    description:
      type: string
      description: "One-line description of the resource"
  required:
    - type
    - name
execution:
  sandbox: inherit
  timeout: 30s
activation: discoverable
