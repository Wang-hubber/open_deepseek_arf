name: memory_store
description: Write memories (facts, preferences, decisions, context) to the memory directory
parameters:
  type: object
  properties:
    content:
      type: string
      description: "Memory content to store"
    category:
      type: string
      enum: [fact, preference, decision, context]
      description: "Category of memory"
  required:
    - content
execution:
  sandbox: inherit
  timeout: 30s
activation: kernel
