version: "1.0"
name: ARF Test
stages:
  - stage: test
    displayName: "Automated Tests"
    steps:
      - step: python-test
        name: "Run pytest with coverage"
        image: python:3.11
        commands:
          - pip install -e ".[dev]"
          - pip install pytest-cov
          - pytest --cov=arf --cov-report=term --cov-report=xml
