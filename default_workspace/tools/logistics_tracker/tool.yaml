name: logistics_tracker
description: "批量查询物流状态，支持从Excel文件读取订单或手动输入，自动识别快递公司，结果可导出到新Excel文件"
parameters:
  type: object
  properties:
    excel_path:
      type: string
      description: "Excel文件路径（上传到工作区的文件路径），文件需包含'订单号'和'运单号'列，'快递公司'列可选"
    orders:
      type: array
      description: "手动输入的订单列表（与excel_path二选一），每个订单包含order_id（订单号）、tracking_number（运单号）、carrier（快递公司，可选）"
      items:
        type: object
        properties:
          order_id:
            type: string
            description: "订单号"
          tracking_number:
            type: string
            description: "运单号/快递单号"
          carrier:
            type: string
            description: "快递公司名称（可选，不填则自动识别）"
    output_path:
      type: string
      description: "结果输出Excel文件路径（可选，默认在原Excel同目录生成带'_结果'后缀的文件）"
  required: []
