[package]
name = "arf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ARF Engine: ReAct loop — receive messages, call model, emit actions"

[dependencies]
arf-core = { path = "../arf-core" }
arf-agent = { path = "../arf-agent" }
arf-bus = { path = "../arf-bus" }
arf-session = { path = "../arf-session" }
arf-state = { path = "../arf-state" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "test-util"] }
