[package]
name = "arf-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ARF MCP — Model Context Protocol node on the Bus"

[dependencies]
arf-core = { path = "../arf-core" }
arf-bus = { path = "../arf-bus" }
arf-pool = { path = "../arf-pool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.8"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
arf-model-adapter = { path = "../arf-model-adapter" }
