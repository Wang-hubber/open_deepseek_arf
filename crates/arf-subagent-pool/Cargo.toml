[package]
name = "arf-subagent-pool"
version = "0.1.0"
edition = "2021"

[dependencies]
arf-agent = { path = "../arf-agent" }
arf-bus = { path = "../arf-bus" }
arf-core = { path = "../arf-core" }
arf-engine = { path = "../arf-engine" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
