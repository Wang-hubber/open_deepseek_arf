[project]
name = "multi_agent_team"
version = "0.1.0"
description = "Example multi-agent team app for ARF new design"
requires-python = ">=3.11"
dependencies = [
    "py-arf @ file://../../py-arf",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]