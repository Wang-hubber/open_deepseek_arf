[package]
name = "recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phase 6 task 6.12 — App-level Recovery (AppCheckpoint + Bus::barrier + file persistence)"
publish = false

[[bin]]
name = "recovery"
path = "src/main.rs"

[dependencies]
arf-core = { path = "../../crates/arf-core" }
arf-bus = { path = "../../crates/arf-bus" }
arf-engine = { path = "../../crates/arf-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
