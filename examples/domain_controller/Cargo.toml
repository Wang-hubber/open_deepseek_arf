[package]
name = "domain_controller"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phase 6 task 6.11 — McpFacade example (top Bus ↔ MCP sub-Bus forwarding)"
publish = false

[[bin]]
name = "domain_controller"
path = "src/main.rs"

[dependencies]
arf-core = { path = "../../crates/arf-core" }
arf-bus = { path = "../../crates/arf-bus" }
arf-engine = { path = "../../crates/arf-engine" }
arf-model-adapter = { path = "../../crates/arf-model-adapter" }
arf-mcp = { path = "../../crates/arf-mcp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
