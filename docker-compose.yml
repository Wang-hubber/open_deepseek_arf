services:
  arf:
    build: .
    container_name: arf
    ports:
      - "8000:8000"
    volumes:
      - arf_data:/app/data
      - arf_workspace:/app/workspace
    environment:
      - ARF_WORKSPACE=/app/workspace
      - ARF_WORKSPACE_NAME=default
      - ARF_DB_NAME=arf.db
      - ARF_CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
    restart: unless-stopped

volumes:
  arf_data:
  arf_workspace:
