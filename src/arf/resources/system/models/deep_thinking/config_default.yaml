name: deep_thinking
description: "深度思考模型，用于复杂推理、代码生成等核心任务，是系统的必备模型"
model_type: deep_thinking
required: true
config_template:
  base_url:
    label: "API 地址"
    type: string
    required: true
    placeholder: "https://api.deepseek.com"
  api_key:
    label: "API 密钥"
    type: password
    required: true
    placeholder: "sk-..."
  model_name:
    label: "模型名称"
    type: string
    required: true
    placeholder: "deepseek-v4-pro"
  temperature:
    label: "温度"
    type: number
    default: 0.7
  max_tokens:
    label: "最大 Token"
    type: number
    default: 40960
depends_on: []
config_page: "DeepSeekConfigForm"
