name: quick_no_thinking
description: "无思考快速模型，用于会话初始响应，不进行内部推理"
model_type: quick_no_thinking
required: false
config_template:
  base_url:
    label: "API 地址"
    type: string
    required: true
    placeholder: "https://api.deepseek.com"
  api_key:
    label: "API 密钥"
    type: password
    required: true
    placeholder: "sk-..."
  model_name:
    label: "模型名称"
    type: string
    required: true
    placeholder: "deepseek-v4-flash"
  temperature:
    label: "温度"
    type: number
    default: 0.3
  max_tokens:
    label: "最大 Token"
    type: number
    default: 102400
depends_on: []
config_page: "DeepSeekConfigForm"
