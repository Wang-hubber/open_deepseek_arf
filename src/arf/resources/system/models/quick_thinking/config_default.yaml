name: quick_thinking
description: "快速思考模型，用于简单总结和摘要任务"
model_type: quick_thinking
required: false
config_template:
  base_url:
    label: "API 地址"
    type: string
    required: true
    placeholder: "https://api.deepseek.com"
  api_key:
    label: "API 密钥"
    type: password
    required: true
    placeholder: "sk-..."
  model_name:
    label: "模型名称"
    type: string
    required: true
    placeholder: "deepseek-chat"
  temperature:
    label: "温度"
    type: number
    default: 0.3
  max_tokens:
    label: "最大 Token"
    type: number
    default: 4096
depends_on: []
config_page: "DeepSeekConfigForm"
