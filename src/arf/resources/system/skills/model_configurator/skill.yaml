name: model_configurator
description: "Configure models — add new model configs or modify existing ones"
prompt_template: |
  # Model Configurator
  
  Configure a model in the workspace. Operations:
  
  - **add**: Create a new model config.yaml from a system slot's config_default.yaml template
  - **modify**: Update an existing model's config (base_url, api_key, model_name, etc.)
  - **test**: Test the model connection using model_manager
  
  When adding a new model:
  1. Check if a system slot exists for this model type via resource_registrar
  2. Read the config_default.yaml to get the config_template
  3. Ask the user for required fields
  4. Write config.yaml to the workspace models directory
  
  When modifying:
  1. Read the existing config.yaml
  2. Update only the fields the user wants to change
  3. Write back
tools:
  - model_manager
  - file_reader
  - file_writer
parameters:
  model_type:
    type: string
    description: "Type of model to configure (deep_thinking, embedding, etc.)"
  action:
    type: string
    description: "add or modify"
    enum: [add, modify]
