name: validate_skill
description: "Validate a newly created or modified skill by checking structure, dependencies, and prompt semantics"
prompt_template: |
  Validate the skill at path `{skill_path}`. Perform these checks:

  ## 1. Structure Check

  - `skill.yaml` exists and is valid YAML
  - Required fields present: `name` (non-empty snake_case), `description` (non-empty)
  - `prompt_template` exists and is non-empty (a skill without instructions is useless)
  - If `parameters` is defined, each parameter must have `type` (string/integer/boolean/object/array)
  - `name` must be snake_case (lowercase letters, digits, underscores only)

  ## 2. Dependency Check

  - For each tool in `tools`, verify it exists in the registry:
    call `resource_registrar` action `check` for each tool (resource_type="tool", name="<tool_name>")
  - For each sub-skill in `sub_skills` (if any), verify it exists:
    call `resource_registrar` action `check` for each (resource_type="skill", name="<skill_name>")
  - Check depends_on: if the skill's config_default.yaml has `depends_on`, verify those
    models are configured via `resource_registrar` action `check_deps`

  ## 3. Semantic Check

  - `prompt_template` must describe a clear workflow with identifiable steps
    (look for numbered steps, section headers, or sequential action verbs)
  - Tools referenced in `prompt_template` should match the `tools` list —
    flag any tool mentioned in the prompt but missing from the list, or vice versa
  - If the skill is a generator-type (creates resources), verify it references
    `file_writer` or equivalent persistence action
  - `description` should be a one-line summary of what the skill does (not generic)

  ## 4. Report

  Report findings in this format:

  ```
  Validation Report for {skill_path}

  === Structure ===
  [PASS/FAIL] skill.yaml exists and is valid YAML
  [PASS/FAIL] name field present and valid (snake_case)
  [PASS/FAIL] description field present and descriptive
  [PASS/FAIL] prompt_template exists and non-empty
  [PASS/FAIL] parameters type-checked (if present)

  === Dependencies ===
  [PASS/FAIL] All tools in 'tools' list exist: {tool_names}
  [PASS/FAIL] All sub_skills exist: {sub_skill_names}
  [PASS/FAIL] depends_on models configured

  === Semantics ===
  [PASS/FAIL] prompt_template has clear workflow/steps
  [PASS/FAIL] tools in prompt match tools list
  [PASS/FAIL] description is specific and meaningful

  Summary: X/Y checks passed
  Verdict: [READY / NEEDS FIXES]

  Issues to fix:
  - (list each failing check with specific fix needed)
  ```

  If the skill passes all checks, respond with "Verdict: READY".
  If any check fails, list what needs to be fixed.
tools:
  - file_reader
  - resource_registrar
parameters:
  skill_path:
    type: string
    description: "Path to the skill directory to validate, e.g. skills/my_skill"
