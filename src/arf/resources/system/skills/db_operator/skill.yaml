name: db_operator
description: "SQLite database operations — create tables, insert, update, query"
prompt_template: |
  # Database Operator
  
  Work with SQLite databases in the workspace. Operations:
  
  - **create_table**: Create a new table with column definitions
  - **insert**: Insert rows into a table
  - **update**: Update rows matching a condition
  - **query**: Run SELECT queries
  - **list_tables**: List all tables in a database
  
  All operations use the workspace's SQLite database.
  Use parameterized queries to prevent SQL injection.
  
  Database files are stored in the workspace under data/.
tools:
  - file_reader
  - file_writer
parameters:
  action:
    type: string
    description: "Database operation to perform"
    enum: [create_table, insert, update, query, list_tables]
  db_name:
    type: string
    description: "Name of the SQLite database file"
