name: memory_extract
description: "Extract important information from the current conversation and persist it as long-term memory. Invoke after each assistant response when the conversation reveals user preferences, personal information, or other worth-remembering facts."
prompt_template: |
  Review the conversation above and extract any information worth remembering for future conversations.

  ## What to Store

  1. **User Profile**: Age, gender, location, coding ability, language habits, occupation, etc.
  2. **Preferences**: Coding style, tool preferences, communication style, workflow habits, etc.
  3. **Important Facts**: Project context, environment details, constraints, decisions made.
  4. **Explicit Requests**: Anything the user asked you to remember.

  ## What NOT to Store

  - Transient conversation state (what you're currently working on right now)
  - Information already present in long-term memory (read first to check)
  - Trivial or obvious information

  ## Procedure

  1. Call `memory_store` action `read` to get the current long-term memory.
  2. Compare with the conversation — identify NEW information worth storing.
  3. If nothing new: stop. Do not write unchanged content.
  4. Merge new information into the existing memory structure:

  ```markdown
  # Long-Term Memory

  ## User Profile
  - Age: ...
  - Gender: ...
  - Location: ...
  - Coding Ability: ...
  - Language: ...
  - ...

  ## Preferences
  - ...

  ## Important Facts
  - ...

  ## Decisions
  - ...

  ---
  Last updated: <ISO datetime>
  Total entries: <count>
  ```

  5. Call `memory_store` action `write` with the merged content.

  Be selective — quality over quantity. If nothing worth storing, skip extraction.
tools:
  - memory_store
parameters: {}
