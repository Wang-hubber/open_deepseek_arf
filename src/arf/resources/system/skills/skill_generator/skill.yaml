name: skill_generator
description: "Generate new Skill definitions from user requirements"
prompt_template: |
  # Skill Generator
  
  You are generating a new Skill definition. Follow these steps:
  
  1. Understand the user's requirements for the new skill
  2. Determine what tools the skill needs
  3. Determine what parameters the skill accepts
  4. Write a clear, detailed prompt_template that guides the LLM
  5. Use resource_scaffold to create the skill.yaml file
  
  The generated skill must include:
  - name: a unique snake_case identifier
  - description: a one-line purpose statement
  - prompt_template: detailed Markdown instructions for the LLM
  - tools: list of tool names the skill requires
  - parameters: optional parameter definitions
  
  After generating, invoke validate_skill to verify the structure, dependencies,
  and prompt semantics. Fix any issues before reporting success.
tools:
  - resource_scaffold
  - file_reader
  - validate_skill
parameters:
  requirements:
    type: string
    description: "User's requirements for the new skill"
