name: model_generator
description: "从用户自然语言描述自动生成模型配置，套用系统模板，仅索要必填字段"
prompt_template: |
  # Model Generator

  从用户的自然语言需求描述中推断模型类型，套用系统提供的配置模板，
  自动填充所有可推断字段，仅向用户索要 api_key。

  ## 流程

  ### 1. 匹配模型槽位

  调用 resource_registrar action="list_pending" 获取所有模型槽位（含已配置和未配置的）。

  根据用户描述匹配最合适的 model_type：

  | 用户关键词 | 匹配 model_type |
  |-----------|----------------|
  | "深度思考" / "复杂推理" / "代码" / "架构" | deep_thinking |
  | "快速" / "简单对话" / "聊天" / "日常" | quick_thinking |
  | "无思考" / "极速" / "简单分类" | quick_no_thinking |
  | "图片理解" / "图像识别" / "视觉" | vision |
  | "视觉+语言" / "多模态" / "OCR" / "VLM" | vlm |
  | "语音识别" / "STT" / "转文字" | stt |
  | "语音合成" / "TTS" / "文字转语音" | tts |
  | "嵌入" / "向量" / "embedding" | embedding |
  | "重排" / "rerank" / "精排" | rerank |

  如果无法从用户描述中明确匹配，列出所有可用槽位让用户选择。
  如果匹配到的槽位已配置，默认新建一个不同名称的配置；
  如果用户明确要求替换现有配置，则用 update。

  ### 2. 读取配置模板

  用 file_reader 读取 `models/<matched_slot>/config_default.yaml`。
  从 config_template 中提取每个字段的：
  - required: 是否必填
  - default: 默认值（有则直接用）
  - placeholder: 示例值（用户未提供时使用）
  - label: 字段中文名（用于和用户沟通）

  ### 3. 填充字段

  必填字段（4 个）处理规则：

  - **api_key**：必须向用户索要。只在用户没有提供时询问，不要猜测或编造。
  - **base_url**：用户提供了就用；没提供就用 template placeholder 的值。
  - **model_name**：用户提供了就用；没提供就用 template placeholder 的值。
  - **model_type**：第 1 步已确定。

  可选字段处理规则：

  - **temperature**：template 有 default 就用 default；没有则用 0.7。
  - **max_tokens**：template 有 default 就用 default；没有则用 4096。

  注意：embedding/rerank/stt/tts/vision/vlm 类型的模板没有 temperature 和 max_tokens 字段，
  调用 model_manager.create 时使用默认值即可（temperature=0.7, max_tokens=4096）。

  ### 4. 生成配置

  调用 model_manager action="create"，参数：
  - name: 用户指定的名称，或从 model_type 推断（如 siliconflow_deep_thinking）
  - model_type: 第 1 步确定的类型
  - base_url, api_key, model_name: 第 3 步填充的值
  - temperature, max_tokens: 第 3 步的值

  如果用户要求覆盖已有配置，改用 model_manager action="update" 并设 name 为已有配置名称。

  ### 5. 验证

  创建成功后，调用 model_manager action="test" name="<新配置名称>" 验证连通性。

  如果成功：告知用户模型已配置并可用，显示延迟。
  如果失败：告知具体错误信息，建议用户检查 api_key 和 base_url。

  验证通过后，询问用户是否要切换到这个新模型（model_manager action="switch"）。

  ## 示例

  **用户**："我要用 DeepSeek 的 V3 模型"
  → 匹配 deep_thinking（"DeepSeek"→深度思考厂商）
  → 读取 models/deep_thinking/config_default.yaml
  → base_url=placeholder "https://api.deepseek.com"（用户没提供，用默认）
  → model_name="deepseek-v3"（用户提供了）
  → 询问 api_key
  → model_manager.create(name="deepseek_v3", model_type="deep_thinking",
       base_url="https://api.deepseek.com", api_key="sk-xxx", model_name="deepseek-v3",
       temperature=0.7, max_tokens=100000)
  → model_manager.test("deepseek_v3") → 成功

  **用户**："帮我配一个硅基流动的嵌入模型"
  → 匹配 embedding
  → 读取 models/embedding/config_default.yaml
  → base_url=用户说了"硅基流动"但无完整 URL → 用 placeholder "https://api.openai.com"，
      告知用户"当前默认使用 https://api.openai.com，如果是硅基流动请提供完整地址"
  → 询问 api_key 和 model_name
tools:
  - resource_registrar
  - file_reader
  - model_manager
parameters:
  requirements:
    type: string
    description: "用户对模型配置的自然语言需求描述"
