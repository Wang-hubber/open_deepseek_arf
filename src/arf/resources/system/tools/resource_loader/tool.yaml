name: resource_loader
description: "Activate or deactivate tools and skills on demand. Use 'list_active' to see available vs active tools, 'activate' to load tools discovered from skills, 'deactivate' to free resources. Kernel tools (file_reader, file_writer, file_deleter, resource_loader) cannot be deactivated."
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [activate, deactivate, list_active]
      description: "Operation: 'activate' loads tools for use, 'deactivate' unloads them, 'list_active' shows current state"
    tools:
      type: array
      items:
        type: string
      description: "List of tool names to activate or deactivate. Required for activate/deactivate actions."
  required:
    - action
