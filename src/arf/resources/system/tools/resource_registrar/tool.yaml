name: resource_registrar
description: "Query and request configuration for system resources. Use 'check' to verify if a resource is configured, 'list_pending' to see all unconfigured resources, 'check_deps' to verify dependencies."
parameters:
  type: object
  properties:
    action:
      type: string
      description: "Action to perform"
      enum: [check, list_pending, check_deps]
    resource_type:
      type: string
      description: "Resource type: model, tool, or skill"
      enum: [model, tool, skill]
    name:
      type: string
      description: "Resource name"
  required: [action]
