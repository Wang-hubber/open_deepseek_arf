name: memory_store
description: "Long-term memory that persists across conversations. Read current memories, write new ones (with automatic backup), check storage stats, and compress memories. Use 'read' to see stored memories, 'write' to persist new memories (merges with existing), 'stats' to check storage usage, 'compress' to consolidate memories using a specified model."
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [read, write, stats, compress]
      description: "Operation: 'read' returns current memories, 'write' persists new content (with backup rotation), 'stats' shows usage, 'compress' consolidates memories"
    content:
      type: string
      description: "Full markdown content of the long-term memory. Required for 'write' and 'compress' actions. Should be structured with sections for User Profile, Preferences, Facts, Decisions."
    model:
      type: string
      description: "Model name to use for compression (optional for 'compress' action). Uses a quick_thinking model if available."
  required:
    - action
