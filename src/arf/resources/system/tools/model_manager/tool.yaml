name: model_manager
description: "Manage model resources: create, list, get, update, delete, test, and switch models. Use 'list' to see all configured models, 'create' to add a new model (quick_thinking, embedding, rerank, vision, tts, etc.), 'test' to verify connectivity, and 'switch' to change the active model."
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [create, list, get, update, delete, test, switch]
      description: "Operation to perform"
    name:
      type: string
      description: "Model config name (required for create/get/update/delete/test/switch). Used as directory name under models/."
    model_type:
      type: string
      enum: [deep_thinking, quick_thinking, embedding, rerank, vision, tts]
      description: "Type of model (required for create/update)"
    base_url:
      type: string
      description: "API base URL (required for create, optional for update)"
    api_key:
      type: string
      description: "API key (required for create, optional for update)"
    model_name:
      type: string
      description: "Model identifier for the API (required for create, optional for update)"
    temperature:
      type: number
      description: "Temperature 0.0-2.0 (default 0.7)"
    max_tokens:
      type: integer
      description: "Max output tokens (default 4096)"
  required:
    - action
