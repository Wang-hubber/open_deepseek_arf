name: manage_hooks
description: "Manage session lifecycle hooks. Hooks are external commands that run at specific session events (SessionStart, PreToolUse, PostToolUse, SessionEnd). Use 'list' to see current hooks, 'add' to register a new hook, 'remove' to delete a hook, 'update' to modify an existing hook. When a user wants automated actions (e.g., send email after tool execution, log to external service), register a PostToolUse hook with the appropriate command."
parameters:
  type: object
  properties:
    action:
      type: string
      enum: [list, add, remove, update]
      description: "Operation: 'list' shows all configured hooks, 'add' registers a new hook, 'remove' deletes an existing hook by name, 'update' modifies an existing hook's command/timeout/enabled/matcher"
    event:
      type: string
      enum: [SessionStart, PreToolUse, PostToolUse, SessionEnd]
      description: "The hook event to target. Required for 'add', 'remove', 'update'. SessionStart fires once after the first assistant response (used for title generation). PreToolUse fires before every tool execution. PostToolUse fires after every tool execution. SessionEnd fires when the conversation session ends."
    name:
      type: string
      description: "Unique name for the hook. Required for 'add', 'remove', 'update'. Use descriptive names like 'email_notifier', 'slack_logger', 'custom_validator'."
    command:
      type: string
      description: "Shell command to execute. Required for 'add', optional for 'update'. The command receives context via environment variables: ARF_HOOK_EVENT, ARF_HOOK_WORKSPACE, ARF_HOOK_SESSION_ID, ARF_HOOK_TOOL_NAME, ARF_HOOK_TOOL_INPUT, ARF_HOOK_TOOL_OUTPUT. Large payloads are passed via stdin JSON. Exit code 0=continue, 1=block action, 2=inject message."
    timeout:
      type: integer
      description: "Timeout in seconds for the hook command (default 30). Optional."
    enabled:
      type: boolean
      description: "Whether the hook is active (default true). Set to false to temporarily disable without removing."
    matcher:
      type: string
      description: "Tool name filter for PreToolUse/PostToolUse hooks (e.g., 'bash', 'write_file'). Use '*' to match all tools. Only applies to PreToolUse and PostToolUse events."
  required:
    - action
