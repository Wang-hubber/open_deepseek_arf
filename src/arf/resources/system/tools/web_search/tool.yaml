name: web_search
description: "联网搜索，使用 DuckDuckGo 检索互联网信息并返回标题、摘要和链接列表。免费无需 API Key，用户可在 workspace 中自定义覆盖。"
parameters:
  type: object
  properties:
    query:
      type: string
      description: "搜索关键词，支持中文和英文"
    max_results:
      type: integer
      description: "最大返回结果数，默认 10，上限 20"
  required:
    - query
