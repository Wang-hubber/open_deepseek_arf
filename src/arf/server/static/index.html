<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARF</title>
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg-primary: #f8f9fb;
      --bg-panel: #ffffff;
      --bg-bubble-assistant: #f1f3f5;
      --bg-bubble-user: #4f6ef7;
      --bg-tool-card: #f8f9fb;
      --bg-input: #ffffff;
      --bg-status: #1a1a2e;
      --accent: #4f6ef7;
      --accent-hover: #3d5ce5;
      --accent-light: #eef0ff;
      --success: #22c55e;
      --success-bg: #f0fdf4;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --loading: #4f6ef7;
      --loading-bg: #eef0ff;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --border-light: #f3f4f6;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 1px 3px rgba(0,0,0,.08);
      --transition: 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary); color: var(--text-primary); line-height: 1.5;
    }
    .hidden { display: none !important; }

    /* ===== Config Page ===== */
    #config-page {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .config-card {
      background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      width: 480px; padding: 40px;
    }
    .config-card h1 { font-size: 22px; margin-bottom: 4px; }
    .config-card .sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
    .config-card .badge {
      display: inline-block; background: #fef3c7; color: #92400e;
      font-size: 12px; padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #374151; }
    .field input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; outline: none; transition: border-color var(--transition);
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.12); }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 24px; border: none; border-radius: var(--radius-sm); font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background var(--transition), opacity var(--transition);
      width: 100%;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #e5e7eb; color: #374151; margin-top: 8px; }
    .btn-secondary:hover { background: #d1d5db; }

    #test-result {
      margin-top: 16px; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5;
    }
    .result-ok { background: var(--success-bg); border: 1px solid #a7f3d0; color: #065f46; }
    .result-err { background: var(--error-bg); border: 1px solid #fecaca; color: #991b1b; }
    .result-loading { background: var(--loading-bg); border: 1px solid #bfdbfe; color: #1e40af; }

    /* ===== Three-Column Layout ===== */
    #main-layout {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      grid-template-rows: 36px 1fr;
      height: 100vh;
    }
    .lock-btn {
      background: none; border: none; color: #e0e0e0; cursor: pointer; font-size: 13px;
      padding: 2px 6px; border-radius: 4px; transition: all var(--transition);
    }
    .lock-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    #status-bar {
      grid-column: 1 / -1; grid-row: 1;
      background: var(--bg-status); color: #e0e0e0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; font-size: 13px; z-index: 10;
    }
    #status-bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-ok { background: var(--success); }
    .dot-err { background: var(--error); }
    #status-bar .status-left, #status-bar .status-right { display: flex; align-items: center; gap: 8px; }

    /* ===== Session Panel (Left) ===== */
    #session-panel {
      grid-column: 1; grid-row: 2;
      background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #session-header {
      padding: 12px; border-bottom: 1px solid var(--border);
    }
    #btn-new-session {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 10px 12px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-md); font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background var(--transition);
    }
    #btn-new-session:hover { background: var(--accent-hover); }
    #btn-new-session:disabled { opacity: 0.5; cursor: not-allowed; }

    #session-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    #session-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 20px; color: var(--text-muted); font-size: 13px; text-align: center;
    }
    #session-error {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 20px; gap: 12px;
    }
    #session-error .err-text { color: var(--error); font-size: 13px; }
    #session-error .btn-retry {
      padding: 6px 16px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
    }

    .session-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 2px;
      transition: background var(--transition); position: relative;
    }
    .session-item:hover { background: var(--border-light); }
    .session-item.active { background: var(--accent-light); }
    .session-item.viewing { background: #fef9e7; }
    .session-item .si-content { flex: 1; min-width: 0; }
    .session-item .si-title {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-item .si-time {
      font-size: 11px; color: var(--text-muted); margin-top: 1px;
    }
    .session-item .si-delete {
      flex-shrink: 0; width: 26px; height: 26px; display: flex; align-items: center;
      justify-content: center; border-radius: var(--radius-sm); border: none;
      background: transparent; color: var(--text-muted); cursor: pointer;
      font-size: 16px; transition: all var(--transition); opacity: 0;
    }
    .session-item:hover .si-delete { opacity: 1; }
    .session-item .si-delete:hover { color: var(--error); background: var(--error-bg); }

    .session-skeleton {
      display: flex; flex-direction: column; gap: 8px; padding: 8px;
    }
    .session-skeleton .sk-item {
      height: 44px; border-radius: var(--radius-sm);
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ===== Chat Panel (Center) ===== */
    #chat-panel {
      grid-column: 2; grid-row: 2;
      display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    }
    #chat-history { flex: 1; overflow-y: auto; padding: 20px 24px; scroll-behavior: smooth; }
    #chat-input-wrap {
      display: flex; border-top: 1px solid var(--border); padding: 12px 16px;
      background: var(--bg-input); gap: 8px;
    }
    #chat-textarea {
      flex: 1; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px;
      resize: none; font-size: 14px; outline: none; min-height: 44px; max-height: 120px;
      font-family: inherit; line-height: 1.4;
    }
    #chat-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.08); }
    #chat-textarea:disabled { background: #f9fafb; color: var(--text-muted); }
    #btn-send {
      padding: 10px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 14px;
      font-weight: 600; white-space: nowrap; transition: background var(--transition);
      align-self: flex-end;
    }
    #btn-send:hover { background: var(--accent-hover); }
    #btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    #viewing-banner {
      display: none; align-items: center; justify-content: center; gap: 8px;
      padding: 6px 16px; background: #fef9e7; color: #92400e; font-size: 12px;
      border-bottom: 1px solid #fde68a; flex-shrink: 0;
    }
    #viewing-banner .vb-close {
      background: none; border: none; color: #92400e; cursor: pointer;
      font-size: 14px; font-weight: bold; padding: 0 4px;
    }

    /* ===== Chat Messages ===== */
    .chat-msg {
      margin-bottom: 20px; max-width: 82%; display: flex; flex-direction: column;
      animation: msgSlideIn 0.25s ease;
    }
    @keyframes msgSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .chat-msg.user { margin-left: auto; align-items: flex-end; }
    .chat-msg.user .bubble {
      background: var(--bg-bubble-user); color: #fff;
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
    }
    .chat-msg.assistant .bubble {
      background: var(--bg-bubble-assistant); color: var(--text-primary);
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
    }
    .chat-msg.system .bubble {
      background: #fef3c7; color: #92400e; border-radius: var(--radius-sm);
      font-size: 13px; max-width: 100%;
    }
    .bubble {
      padding: 12px 16px; line-height: 1.6; font-size: 14px;
      box-shadow: var(--shadow-sm); word-break: break-word;
    }
    .bubble pre {
      background: rgba(0,0,0,.05); padding: 10px 12px; border-radius: var(--radius-sm);
      overflow-x: auto; margin: 8px 0; font-size: 13px; line-height: 1.5;
    }
    .bubble code { font-size: 13px; }
    .bubble p { margin: 4px 0; }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .msg-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; padding: 0 4px; }

    /* Text Segments */
    .text-segment { position: relative; }
    .text-segment + .text-segment { margin-top: 4px; }
    .text-segment + .tool-card { margin-top: 10px; }
    .tool-card + .text-segment { margin-top: 10px; }

    .streaming-cursor {
      display: inline; color: var(--accent); font-weight: 400;
      animation: cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Tool Cards */
    .tool-card {
      background: var(--bg-tool-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden; font-size: 13px;
      box-shadow: var(--shadow-sm); transition: border-color var(--transition);
    }
    .tool-card.loading { border-left: 3px solid var(--loading); }
    .tool-card.completed { border-left: 3px solid var(--success); }
    .tool-card.failed { border-left: 3px solid var(--error); }

    .tc-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      cursor: pointer; user-select: none; transition: background var(--transition);
    }
    .tc-header:hover { background: rgba(0,0,0,.02); }
    .tc-icon { font-size: 15px; flex-shrink: 0; width: 18px; text-align: center; }
    .tc-icon.spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .tc-name { font-weight: 600; color: var(--text-primary); flex: 0 1 auto; }
    .tc-status {
      font-size: 11px; padding: 1px 8px; border-radius: 10px; white-space: nowrap;
      flex-shrink: 0;
    }
    .tc-status.executing { background: var(--loading-bg); color: var(--loading); }
    .tc-status.done { background: var(--success-bg); color: #065f46; }
    .tc-status.fail { background: var(--error-bg); color: #991b1b; }
    .tc-arrow {
      font-size: 10px; color: var(--text-muted); transition: transform var(--transition);
      margin-left: auto; flex-shrink: 0;
    }
    .tc-arrow.open { transform: rotate(90deg); }

    .tc-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .tc-body.open {
      max-height: 400px; overflow-y: auto; opacity: 1;
      border-top: 1px solid var(--border-light);
    }
    .tc-body-inner { padding: 8px 12px 12px; }
    .tc-field { margin-bottom: 10px; }
    .tc-field:last-child { margin-bottom: 0; }
    .tc-field-label {
      font-size: 11px; color: var(--text-muted); margin-bottom: 3px;
      text-transform: uppercase; letter-spacing: .3px;
    }
    .tc-field-value {
      background: #fff; padding: 8px 10px; border-radius: var(--radius-sm);
      max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
      color: var(--text-primary); line-height: 1.45;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px;
      border: 1px solid var(--border-light);
    }
    .tc-error-msg { color: var(--error); font-size: 12px; padding: 4px 0; line-height: 1.4; }

    .tool-card.loading .tc-header { animation: pulseBorder 2s ease-in-out infinite; }
    @keyframes pulseBorder {
      0%, 100% { border-left-color: var(--loading); }
      50% { border-left-color: #93a5f7; }
    }

    /* Thinking */
    .thinking-section {
      margin-bottom: 10px; border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); overflow: hidden;
      background: #fafbfd; font-size: 13px;
    }
    .thinking-header {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      cursor: pointer; user-select: none; color: var(--text-secondary);
    }
    .thinking-header:hover { background: rgba(0,0,0,.03); }
    .thinking-header .th-arrow {
      font-size: 10px; transition: transform var(--transition);
    }
    .thinking-header .th-arrow.open { transform: rotate(90deg); }
    .thinking-body {
      max-height: 0; overflow: hidden; transition: max-height 0.25s ease;
      padding: 0 10px; color: var(--text-muted); line-height: 1.5;
    }
    .thinking-body.open { max-height: 300px; overflow-y: auto; padding: 0 10px 8px; }

    /* Misc */
    .chat-empty {
      text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px;
    }
    .error-banner {
      background: var(--error-bg); border: 1px solid #fecaca; color: #991b1b;
      padding: 8px 12px; border-radius: var(--radius-sm); margin-top: 8px;
      font-size: 13px;
    }

    /* Upload */
    #btn-upload {
      align-self: flex-end; padding: 10px 12px; background: transparent;
      color: var(--text-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-md); cursor: pointer; font-size: 18px;
      transition: all var(--transition); line-height: 1;
    }
    #btn-upload:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
    #btn-upload.uploading { opacity: 0.5; pointer-events: none; }

    #attach-tags {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 6px;
    }
    #attach-tags:empty { display: none; }
    .attach-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-light); color: var(--accent);
      font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm);
      max-width: 220px;
    }
    .attach-tag .at-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-tag .at-remove { cursor: pointer; font-weight: bold; flex-shrink: 0; }
    .attach-tag .at-remove:hover { color: var(--error); }
    .attach-tag .at-size { color: var(--text-muted); font-size: 11px; white-space: nowrap; flex-shrink: 0; }
    .attach-tag.error { background: var(--error-bg); color: #991b1b; }

    /* Drag overlay */
    #drag-overlay {
      position: fixed; top: 36px; left: 280px; right: 260px; bottom: 0;
      background: rgba(79,110,247,0.06); border: 2px dashed var(--accent);
      display: none; align-items: center; justify-content: center;
      z-index: 20; pointer-events: none;
    }
    #drag-overlay.show { display: flex; }
    #drag-overlay .drag-text {
      background: var(--accent); color: #fff; padding: 14px 28px;
      border-radius: var(--radius-md); font-size: 15px; font-weight: 600;
    }

    /* ===== Resource Panel (Right) ===== */
    #resource-panel-right {
      grid-column: 3; grid-row: 2;
      background: var(--bg-panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #rp-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; border-bottom: 1px solid var(--border);
    }
    #rp-header .rp-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    #btn-rp-collapse {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 2px 6px; border-radius: 4px;
    }
    #btn-rp-collapse:hover { background: var(--border-light); color: var(--text-primary); }
    #rp-content {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }
    #rp-content.collapsed { max-height: 0; overflow: hidden; padding: 0 12px; opacity: 0; }

    .rp-section { margin-bottom: 16px; }
    .rp-section h3 {
      font-size: 11px; text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 6px; letter-spacing: .5px;
    }
    .rp-item {
      font-size: 13px; padding: 5px 8px; border-radius: 4px; color: var(--text-primary);
    }
    .rp-item .rp-item-desc { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .rp-empty {
      font-size: 12px; color: var(--text-muted); font-style: italic;
      padding: 4px 8px; line-height: 1.5;
    }
    .rp-loading {
      padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;
    }

    /* ===== Vault Unlock Page ===== */
    #vault-page {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .vault-card {
      background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      width: 420px; padding: 40px; text-align: center;
    }
    .vault-card h1 { font-size: 22px; margin-bottom: 4px; }
    .vault-card .sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
    .vault-card .field { margin-bottom: 16px; text-align: left; }
    .vault-card .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #374151; }
    .vault-card .field input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; outline: none; transition: border-color var(--transition);
    }
    .vault-card .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.12); }
    .vault-card .vault-error {
      background: var(--error-bg); border: 1px solid #fecaca; color: #991b1b;
      padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; display: none;
    }

    /* ===== Modal ===== */
    #modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      display: none; align-items: center; justify-content: center;
    }
    #modal-overlay.show { display: flex; }
    .modal-card {
      background: #fff; border-radius: var(--radius-lg); box-shadow: 0 8px 30px rgba(0,0,0,.15);
      width: 420px; max-width: 90vw; padding: 28px;
    }
    .modal-card h2 { font-size: 16px; margin-bottom: 12px; }
    .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; }
    .modal-card .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-card .btn-cancel {
      padding: 8px 18px; border: 1px solid var(--border); background: #fff;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600;
      color: var(--text-secondary);
    }
    .modal-card .btn-cancel:hover { background: var(--border-light); }
    .modal-card .btn-danger {
      padding: 8px 18px; border: none; background: var(--error); color: #fff;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .modal-card .btn-danger:hover { background: #dc2626; }
    .modal-card .btn-confirm {
      padding: 8px 18px; border: none; background: var(--accent); color: #fff;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .modal-card .btn-confirm:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

<!-- ========== Vault Unlock Page ========== -->
<div id="vault-page" class="hidden">
  <div class="vault-card">
    <h1 id="vault-title">🔐 ARF Security Vault</h1>
    <p class="sub" id="vault-sub">输入主密码以解锁你的加密配置和凭据。</p>
    <div class="field">
      <label for="vault-password">主密码</label>

<div id="config-page">
  <div class="config-card">

<script>
// ============================================================================
// State
// ============================================================================
let chatHistory = [];
let activeMessage = null;
let userScrolledUp = false;
let isStreaming = false;
let attachments = [];
const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;

// Session state
let sessions = [];           // list from GET /api/sessions
let activeSession = null;   // { id, title, created_at, message_count } or null
let viewingArchiveId = null; // currently viewing an archived session (read-only)
let sessionLoading = false;

// Modal callbacks
let modalOnConfirm = null;

// ============================================================================
// Init
// ============================================================================
(function() {
  var chatHistoryEl = document.getElementById('chat-history');
  chatHistoryEl.addEventListener('scroll', function() {
    var el = document.getElementById('chat-history');
    var dist = el.scrollHeight - el.scrollTop - el.clientHeight;
    userScrolledUp = dist > 60;
  });

  var ta = document.getElementById('chat-textarea');
  if (ta) {
    ta.addEventListener('input', function() {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    });
  }

  // Check vault status first, then proceed
  checkVaultStatus();

  setInterval(function() {
    if (!document.getElementById('main-layout').classList.contains('hidden')) {
      loadResources();
    }
  }, 15000);

  setupSessionWS();
  setupDragDrop();
  setupIdleTimer();
})();

function setupSessionWS() {
  var proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  var url = proto + '://' + window.location.host + '/ws';
  var ws = null;
  var reconnectDelay = 2000;

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    try {
      ws = new WebSocket(url);
      ws.onopen = function() {
        reconnectDelay = 2000;
      };
      ws.onclose = function() {
        ws = null;
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
      };
      ws.onerror = function() {
        if (ws) ws.close();
      };
    } catch(e) {
      setTimeout(connect, reconnectDelay);
    }
  }

  connect();
}

function setupDragDrop() {
  var dropZones = [
    document.getElementById('chat-history'),
    document.getElementById('chat-input-wrap'),
  ];
  var overlay = document.getElementById('drag-overlay');
  var dragCounter = 0;

  function onDragEnter(e) {
    e.preventDefault(); e.stopPropagation();
    dragCounter++;
    if (overlay) overlay.classList.add('show');
  }
  function onDragLeave(e) {
    e.preventDefault(); e.stopPropagation();
    dragCounter--;
    if (dragCounter <= 0 && overlay) {
      dragCounter = 0;
      overlay.classList.remove('show');
    }
  }
  function onDragOver(e) { e.preventDefault(); e.stopPropagation(); }
  function onDrop(e) {
    e.preventDefault(); e.stopPropagation();
    dragCounter = 0;
    if (overlay) overlay.classList.remove('show');
    if (e.dataTransfer && e.dataTransfer.files.length > 0) {
      uploadFiles(e.dataTransfer.files);
    }
  }

  for (var i = 0; i < dropZones.length; i++) {
    var el = dropZones[i];
    if (!el) continue;
    el.addEventListener('dragenter', onDragEnter);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('dragover', onDragOver);
    el.addEventListener('drop', onDrop);
  }
}

function scrollToBottom(force) {
  if (force || !userScrolledUp) {
    var el = document.getElementById('chat-history');
    if (el) el.scrollTop = el.scrollHeight;
  }
}

function showConfigPage() {
  document.getElementById('config-page').classList.remove('hidden');
  document.getElementById('main-layout').classList.add('hidden');
}

function showMainLayout(status) {
  document.getElementById('config-page').classList.add('hidden');
  document.getElementById('vault-page').classList.add('hidden');
  document.getElementById('main-layout').classList.remove('hidden');
  document.getElementById('status-model').textContent = status.model_name || 'default';
  if (vaultUnlocked) {
    document.getElementById('btn-lock-vault').style.display = '';
  }
  loadSessions();
  loadResources();
}

// ============================================================================
// Vault Management
// ============================================================================
var vaultUnlocked = false;
var vaultInitialized = false;

function checkVaultStatus() {
  fetch('/api/vault/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      vaultInitialized = data.initialized;
      vaultUnlocked = data.unlocked;
      if (vaultInitialized && vaultUnlocked) {
        // Vault is ready, proceed to config/main
        document.getElementById('btn-lock-vault').style.display = '';
        proceedAfterVault();
      } else if (vaultInitialized && !vaultUnlocked) {
        // Vault exists but locked — show unlock page
        showVaultPage(false);
      } else {
        // No vault yet — show init/setup page
        showVaultPage(true);
      }
    })
    .catch(function() {
      showConfigPage(); // fallback if no vault support
    });
}

function showVaultPage(isNew) {
  document.getElementById('vault-page').classList.remove('hidden');
  document.getElementById('config-page').classList.add('hidden');
  document.getElementById('main-layout').classList.add('hidden');

  if (isNew) {
    document.getElementById('vault-title').textContent = '🔐 设置主密码';
    document.getElementById('vault-sub').textContent = '创建主密码以保护你的邮箱授权码、API 密钥和个人记忆。请务必牢记此密码——丢失后将无法恢复。';
    document.getElementById('btn-vault-submit').textContent = '创建保险库';
    document.getElementById('btn-vault-submit').onclick = vaultInit;
    document.getElementById('btn-vault-init').classList.add('hidden');
  } else {
    document.getElementById('vault-title').textContent = '🔐 ARF Security Vault';
    document.getElementById('vault-sub').textContent = '保险库已锁定。请输入主密码解锁。';
    document.getElementById('btn-vault-submit').textContent = '解锁';
    document.getElementById('btn-vault-submit').onclick = vaultUnlock;
    document.getElementById('btn-vault-init').classList.add('hidden');
  }
  document.getElementById('vault-password').value = '';
  document.getElementById('vault-password').focus();
  hideVaultError();
}

function hideVaultError() {
  var el = document.getElementById('vault-error');
  el.style.display = 'none';
  el.textContent = '';
}

function showVaultError(msg) {
  var el = document.getElementById('vault-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function vaultInit() {
  var pw = document.getElementById('vault-password').value;
  if (!pw) { showVaultError('请输入主密码'); return; }
  if (pw.length < 4) { showVaultError('密码至少需要4个字符'); return; }

  var btn = document.getElementById('btn-vault-submit');
  btn.disabled = true;
  btn.textContent = '创建中...';
  hideVaultError();

  fetch('/api/vault/init', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }),
  })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error(err.detail); });
      return r.json();
    })
    .then(function() {
      vaultInitialized = true;
      vaultUnlocked = true;
      document.getElementById('btn-lock-vault').style.display = '';
      document.getElementById('vault-page').classList.add('hidden');
      resetIdleTimer();
      proceedAfterVault();
    })
    .catch(function(e) {
      showVaultError(e.message);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '创建保险库';
    });
}

function vaultUnlock() {
  var pw = document.getElementById('vault-password').value;
  if (!pw) { showVaultError('请输入主密码'); return; }

  var btn = document.getElementById('btn-vault-submit');
  btn.disabled = true;
  btn.textContent = '解锁中...';
  hideVaultError();

  fetch('/api/vault/unlock', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }),
  })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error(err.detail); });
      return r.json();
    })
    .then(function() {
      vaultUnlocked = true;
      document.getElementById('btn-lock-vault').style.display = '';
      document.getElementById('vault-page').classList.add('hidden');
      resetIdleTimer();
      proceedAfterVault();
    })
    .catch(function(e) {
      showVaultError(e.message);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '解锁';
    });
}

function lockVault() {
  fetch('/api/vault/lock', { method: 'POST' })
    .then(function() {
      vaultUnlocked = false;
      document.getElementById('btn-lock-vault').style.display = 'none';
      showVaultPage(false);
    })
    .catch(function() {
      alert('锁定失败');
    });
}

function proceedAfterVault() {
  fetch('/api/config/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.configured) showMainLayout(data);
      else showConfigPage();
    })
    .catch(function() { showConfigPage(); });
}

// ============================================================================
// Idle Timer
// ============================================================================
var IDLE_TIMEOUT = 10 * 60 * 1000; // 10 minutes
var idleTimer = null;

function setupIdleTimer() {
  resetIdleTimer();
  var events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click'];
  for (var i = 0; i < events.length; i++) {
    document.addEventListener(events[i], resetIdleTimer);
  }
}

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  if (!vaultUnlocked) return;
  idleTimer = setTimeout(function() {
    // Auto-lock on idle timeout
    lockVault();
  }, IDLE_TIMEOUT);
}

// ============================================================================
// Session Management
// ============================================================================
function loadSessions() {
  if (sessionLoading) return;
  sessionLoading = true;

  var listEl = document.getElementById('session-list');
  listEl.innerHTML = '<div class="session-skeleton">' +
    '<div class="sk-item"></div><div class="sk-item"></div><div class="sk-item"></div>' +
    '</div>';
  hideSessionStates();

  // Load archived sessions + active session in parallel
  Promise.all([
    fetch('/api/sessions').then(function(r) { return r.json(); }).catch(function() { return null; }),
    fetch('/api/sessions/active').then(function(r) { return r.json(); }).catch(function() { return null; }),
  ]).then(function(results) {
    var archives = results[0];
    var active = results[1];

    if (archives === null) {
      showSessionError();
      sessionLoading = false;
      return;
    }

    sessions = archives || [];
    activeSession = active;

    // If no active session and no archives, show empty
    if (!activeSession && sessions.length === 0) {
      showSessionEmpty();
    } else {
      renderSessionList();
    }

    sessionLoading = false;
  });
}

function renderSessionList() {
  var listEl = document.getElementById('session-list');
  var emptyEl = document.getElementById('session-empty');
  var errorEl = document.getElementById('session-error');

  hideSessionStates();
  listEl.innerHTML = '';

  // Build combined list: active session first (if any), then archives
  var items = [];

  if (activeSession) {
    items.push({
      id: activeSession.id,
      title: activeSession.title,
      ended_at: null, // still active
      created_at: activeSession.created_at,
      message_count: activeSession.message_count,
      isActive: true,
    });
  }

  for (var i = 0; i < sessions.length; i++) {
    var s = sessions[i];
    // Don't show archive that matches active session id
    if (activeSession && s.id === activeSession.id) continue;
    items.push({
      id: s.id,
      title: s.title,
      ended_at: s.ended_at,
      created_at: s.created_at,
      message_count: s.message_count,
      isActive: false,
    });
  }

  // Sort by last activity time (ended_at for archives, now for active)
  items.sort(function(a, b) {
    var aTime = a.isActive ? new Date().toISOString() : (a.ended_at || a.created_at);
    var bTime = b.isActive ? new Date().toISOString() : (b.ended_at || b.created_at);
    return bTime.localeCompare(aTime);
  });

  if (items.length === 0) {
    showSessionEmpty();
    return;
  }

  for (var j = 0; j < items.length; j++) {
    var item = items[j];
    var div = document.createElement('div');
    div.className = 'session-item';
    if (item.isActive && !viewingArchiveId) div.classList.add('active');
    if (viewingArchiveId === item.id) div.classList.add('viewing');

    var timeLabel = item.isActive ? '当前' : relativeTime(item.ended_at || item.created_at);

    div.innerHTML =
      '<div class="si-content">' +
        '<div class="si-title">' + escapeHtml(item.title) + '</div>' +
        '<div class="si-time">' + timeLabel + ' · ' + item.message_count + ' 条消息</div>' +
      '</div>' +
      '<button class="si-delete" title="删除会话">&times;</button>';

    // Click to switch
    div.addEventListener('click', function(itemId, isActive) {
      return function(e) {
        // Ignore if clicking delete button
        if (e.target.closest('.si-delete')) return;
        if (isActive) {
          returnToActive();
        } else {
          switchToArchive(itemId);
        }
      };
    }(item.id, item.isActive));

    // Delete button
    var delBtn = div.querySelector('.si-delete');
    delBtn.addEventListener('click', function(itemId, itemTitle, itemIsActive) {
      return function(e) {
        e.stopPropagation();
        confirmDeleteSession(itemId, itemTitle, itemIsActive);
      };
    }(item.id, item.title, item.isActive));

    listEl.appendChild(div);
  }
}

function createNewSession() {
  // Check capacity: active session counts as 1, archives count
  var totalCount = sessions.length + (activeSession && activeSession.message_count >= 2 ? 1 : 0);

  if (totalCount >= 10 && sessions.length > 0) {
    // Find the oldest archive
    var oldest = sessions[sessions.length - 1]; // list is newest first
    showModal(
      '会话数量已达上限',
      '会话数量已达上限（10个），创建新会话将删除最久未活动的会话"' + escapeHtml(oldest.title) + '"，确定继续吗？',
      '确认创建',
      function() {
        doCreateSession();
      }
    );
  } else {
    doCreateSession();
  }
}

function doCreateSession() {
  var btn = document.getElementById('btn-new-session');
  btn.disabled = true;
  btn.textContent = '创建中...';

  fetch('/api/sessions', { method: 'POST' })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error(err.detail); });
      return r.json();
    })
    .then(function(data) {
      activeSession = data;
      viewingArchiveId = null;
      chatHistory = [];
      clearChat();
      hideViewingBanner();
      setInputEnabled(true);
      addSystemMsg('你好，我是 ARF Agent，你的工作区管理者。我可以帮你管理文件、调整资源，协助你完成工作任务。有什么我可以帮你的？');
      if (!data.fast_model_configured) {
        addSystemMsg('💡 **省费提示**：配置一个 fast 模型（如 deepseek-chat）用于会话摘要和记忆提取等后台任务，可显著降低费用。在 `models/fast/config.yaml` 中添加配置即可。当前将使用主模型完成这些任务。');
      }
      if (data.roadmap && data.roadmap.length > 0) {
        var rm = '## 📋 项目演进路线\n\n';
        for (var i = 0; i < data.roadmap.length; i++) {
          rm += (i + 1) + '. ' + data.roadmap[i] + '\n';
        }
        addSystemMsg(rm);
      }
      loadSessions();
      loadResources();
    })
    .catch(function(e) {
      alert('创建会话失败: ' + e.message);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '+ 新会话';
    });
}

function switchToArchive(sessionId) {
  viewingArchiveId = sessionId;
  setInputEnabled(false);

  var historyEl = document.getElementById('chat-history');
  historyEl.innerHTML = '<div class="chat-empty">加载中...</div>';

  fetch('/api/sessions/' + encodeURIComponent(sessionId))
    .then(function(r) {
      if (!r.ok) throw new Error('Session not found');
      return r.json();
    })
    .then(function(data) {
      clearChat();
      var msgs = data.messages || [];
      chatHistory = msgs.filter(function(m) {
        return m.role === 'user' || m.role === 'assistant';
      });
      renderHistoryMessages(msgs);

      var banner = document.getElementById('viewing-banner');
      banner.style.display = 'flex';
      document.getElementById('viewing-banner-text').textContent =
        '正在查看历史会话: ' + escapeHtml(data.title || sessionId);
    })
    .catch(function(e) {
      document.getElementById('chat-history').innerHTML =
        '<div class="error-banner">加载会话失败: ' + escapeHtml(e.message) + '</div>';
      setInputEnabled(true);
      viewingArchiveId = null;
    })
    .finally(function() {
      renderSessionList();
      loadResources();
    });
}

function returnToActive() {
  viewingArchiveId = null;
  hideViewingBanner();
  setInputEnabled(true);
  clearChat();

  // Re-render the current active history from local chatHistory
  if (chatHistory.length > 0) {
    for (var i = 0; i < chatHistory.length; i++) {
      var m = chatHistory[i];
      if (m.role === 'user') {
        addUserMsg(m.content);
      } else if (m.role === 'assistant') {
        addAssistantMsg(m.content);
      }
    }
  } else {
    addSystemMsg('你好，我是 ARF Agent，你的工作区管理者。我可以帮你管理文件、调整资源，协助你完成工作任务。有什么我可以帮你的？');
  }

  renderSessionList();
  loadResources();
}

function confirmDeleteSession(sessionId, title, isActive) {
  showModal(
    '删除会话',
    '确定删除会话"' + escapeHtml(title) + '"吗？删除后不可恢复。',
    '确认删除',
    function() {
      doDeleteSession(sessionId, isActive);
    },
    true // danger button
  );
}

function doDeleteSession(sessionId, isActive) {
  if (isActive) {
    // Deleting the active session: archive it first (POST), then clear
    if (activeSession && activeSession.message_count >= 2) {
      fetch('/api/sessions', { method: 'POST' })
        .then(function() {
          // Now delete the just-archived session
          return fetch('/api/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' });
        })
        .then(function() { afterActiveDelete(); })
        .catch(function() { afterActiveDelete(); });
    } else {
      afterActiveDelete();
    }
  } else {
    fetch('/api/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' })
      .then(function(r) {
        if (!r.ok) throw new Error('Delete failed');
        // If we were viewing this archive, return to active
        if (viewingArchiveId === sessionId) {
          returnToActive();
        }
        loadSessions();
      })
      .catch(function(e) {
        alert('删除失败: ' + e.message);
      });
  }
}

function afterActiveDelete() {
  activeSession = null;
  viewingArchiveId = null;
  chatHistory = [];
  clearChat();
  hideViewingBanner();
  setInputEnabled(true);

  // Switch to most recent remaining, or create new
  loadSessionsWithCallback(function() {
    if (sessions.length > 0) {
      switchToArchive(sessions[0].id);
    } else {
      doCreateSession();
    }
  });
}

function loadSessionsWithCallback(cb) {
  fetch('/api/sessions')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      sessions = data || [];
      // Also check active
      return fetch('/api/sessions/active');
    })
    .then(function(r) { return r.json(); })
    .then(function(active) {
      activeSession = active;
      renderSessionList();
      if (cb) cb();
    })
    .catch(function() {
      showSessionError();
    });
}

function relativeTime(isoStr) {
  if (!isoStr) return '';
  var then = new Date(isoStr);
  var now = new Date();
  var diffMs = now - then;
  var diffDays = Math.floor(diffMs / 86400000);

  if (diffDays === 0) return '今天';
  if (diffDays === 1) return '昨天';
  if (diffDays <= 7) return '7天内';
  if (diffDays <= 30) return '30天内';
  return then.getFullYear() + '-' +
    String(then.getMonth() + 1).padStart(2, '0') + '-' +
    String(then.getDate()).padStart(2, '0');
}

// ============================================================================
// Chat — streaming (mostly unchanged)
// ============================================================================
function clearChat() {
  document.getElementById('chat-history').innerHTML = '';
  activeMessage = null;
}

function sendMessage() {
  if (isStreaming) return;
  if (viewingArchiveId) return; // read-only mode

  var textarea = document.getElementById('chat-textarea');
  var text = textarea.value.trim();

  var attachCtx = '';
  if (attachments.length > 0) {
    var valid = attachments.filter(function(a) { return !a.error; });
    if (valid.length > 0) {
      attachCtx = '[上传文件]\n';
      for (var i = 0; i < valid.length; i++) {
        var a = valid[i];
        attachCtx += '文件: ' + a.path + ' (' + formatBytes(a.size) + ')\n';
        if (a.preview) {
          attachCtx += '内容预览:\n' + a.preview + '\n';
        }
      }
      attachCtx += '\n';
    }
  }

  var fullText = attachCtx + text;
  if (!text && !attachCtx) return;
  if (!text) fullText = attachCtx + '请查看以上上传的文件。';

  textarea.value = '';
  textarea.style.height = 'auto';
  document.getElementById('btn-send').disabled = true;
  isStreaming = true;
  userScrolledUp = false;

  attachments = [];
  renderAttachments();

  addUserMsg(text || '(uploaded files)');
  activeMessage = createMessageBuilder();

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: fullText, history: chatHistory, stream: true }),
  })
    .then(function(res) {
      if (!res.ok) {
        return res.json().then(function(err) {
          throw new Error(err.detail || 'Request failed');
        });
      }
      return readStream(res.body.getReader());
    })
    .catch(function(e) {
      if (activeMessage) activeMessage.finalize('Error: ' + e.message);
      isStreaming = false;
      setInputEnabled(true);
      document.getElementById('chat-textarea').focus();
    });
}

function readStream(reader) {
  var decoder = new TextDecoder();
  var buffer = '';

  function pump() {
    return reader.read().then(function(result) {
      if (result.done) {
        if (buffer.trim().startsWith('data: ')) {
          try { handleEvent(JSON.parse(buffer.trim().slice(6))); }
          catch(e) {}
        }
        if (activeMessage) activeMessage.finalize(null);
        return;
      }

      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf('data: ') !== 0) continue;
        try { handleEvent(JSON.parse(line.slice(6))); }
        catch(e) {}
      }

      return pump();
    });
  }

  return pump();
}

function handleEvent(evt) {
  if (!activeMessage) return;

  if (evt.type === 'chunk') {
    if (evt.reasoning) {
      activeMessage.appendReasoning(evt.reasoning);
    }
    if (evt.content) {
      activeMessage.appendText(evt.content);
    }
  } else if (evt.type === 'tool_call') {
    activeMessage.addToolCard(evt.name, evt.arguments, evt.id);
  } else if (evt.type === 'tool_result') {
    var ctrl = activeMessage.getToolController(evt.id);
    if (ctrl) {
      var isError = false, errorMsg = '';
      try { var p = JSON.parse(evt.result); if (p && p.error) { isError = true; errorMsg = p.error; } }
      catch(e) {}
      if (isError) ctrl.fail(errorMsg);
      else {
        ctrl.complete(evt.result);
        if (evt.tool === 'file_writer') {
          try {
            var r = JSON.parse(evt.result);
            var path = (r && r.path) || '';
            if (path && (path.indexOf('/tools/') !== -1 || path.indexOf('/skills/') !== -1)) {
              loadResources();
            }
          } catch(e) {}
        }
      }
    }
  } else if (evt.type === 'done') {
    if (activeMessage) activeMessage.finalize(null, evt.history);
    loadResources();
    // Refresh session list to update message count
    loadSessions();
  } else if (evt.type === 'error') {
    if (activeMessage) activeMessage.finalize('Error: ' + (evt.detail || 'Unknown error'));
  }
}

// ============================================================================
// Message Builder (unchanged)
// ============================================================================
function createMessageBuilder() {
  var history = document.getElementById('chat-history');
  var msgDiv = document.createElement('div');
  msgDiv.className = 'chat-msg assistant';
  var bubble = document.createElement('div');
  bubble.className = 'bubble';

  var thinkingSection = document.createElement('div');
  thinkingSection.className = 'thinking-section';
  thinkingSection.style.display = 'none';
  var thinkingHeader = document.createElement('div');
  thinkingHeader.className = 'thinking-header';
  thinkingHeader.innerHTML = '<span class="th-arrow">&#9654;</span> <span>Thinking...</span>';
  var thinkingBody = document.createElement('div');
  thinkingBody.className = 'thinking-body';
  thinkingSection.appendChild(thinkingHeader);
  thinkingSection.appendChild(thinkingBody);
  var thinkingText = '';

  thinkingHeader.addEventListener('click', function() {
    if (thinkingBody.classList.contains('open')) {
      thinkingBody.classList.remove('open');
      thinkingHeader.querySelector('.th-arrow').classList.remove('open');
    } else {
      thinkingBody.classList.add('open');
      thinkingHeader.querySelector('.th-arrow').classList.add('open');
    }
  });

  bubble.appendChild(thinkingSection);

  var textEl = document.createElement('div');
  textEl.className = 'text-segment';
  bubble.appendChild(textEl);
  msgDiv.appendChild(bubble);
  history.appendChild(msgDiv);

  var fullText = '';
  var toolCards = {};
  var cursorEl = document.createElement('span');
  cursorEl.className = 'streaming-cursor';
  cursorEl.textContent = '|';
  textEl.appendChild(cursorEl);
  var finalized = false;

  function collapseThinking() {
    if (thinkingSection.style.display !== 'none' && thinkingBody.classList.contains('open')) {
      thinkingBody.classList.remove('open');
      thinkingHeader.querySelector('.th-arrow').classList.remove('open');
    }
  }

  return {
    appendReasoning: function(reasoning) {
      if (finalized) return;
      thinkingSection.style.display = 'block';
      thinkingText += reasoning;
      thinkingBody.innerHTML = formatMarkdown(thinkingText);
      if (!thinkingBody.classList.contains('open')) {
        thinkingBody.classList.add('open');
        thinkingHeader.querySelector('.th-arrow').classList.add('open');
      }
      scrollToBottom(false);
    },

    appendText: function(chunk) {
      if (finalized) return;
      collapseThinking();
      fullText += chunk;
      if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl);
      textEl.innerHTML = formatMarkdown(fullText);
      textEl.appendChild(cursorEl);
      scrollToBottom(false);
    },

    addToolCard: function(name, args, id) {
      if (finalized) return null;
      collapseThinking();
      if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl);

      if (!fullText) {
        textEl.remove();
      }

      var card = createToolCardElement(name, args);
      bubble.appendChild(card);

      textEl = document.createElement('div');
      textEl.className = 'text-segment';
      textEl.appendChild(cursorEl);
      bubble.appendChild(textEl);
      fullText = '';

      scrollToBottom(false);

      var ctrl = {
        complete: function(result) {
          updateToolCardComplete(card, result);
          scrollToBottom(false);
        },
        fail: function(error) {
          updateToolCardFailed(card, error);
          scrollToBottom(false);
        },
      };
      toolCards[id] = ctrl;
      return ctrl;
    },

    finalize: function(errorText, newHistory) {
      if (finalized) return;
      finalized = true;
      collapseThinking();
      if (newHistory && newHistory.length > 0) {
        chatHistory = newHistory;
      }

      if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl);
      cursorEl = null;

      if (!fullText && textEl && textEl.parentNode) {
        textEl.remove();
      }
      textEl = null;

      if (errorText) {
        var errDiv = document.createElement('div');
        errDiv.className = 'error-banner';
        errDiv.textContent = errorText;
        bubble.appendChild(errDiv);
      }

      scrollToBottom(false);
      activeMessage = null;
      isStreaming = false;
      document.getElementById('btn-send').disabled = false;
      document.getElementById('chat-textarea').focus();
    },

    getToolController: function(id) {
      return toolCards[id] || null;
    },
  };
}

// ============================================================================
// Tool Card DOM (unchanged)
// ============================================================================
function createToolCardElement(name, args) {
  var card = document.createElement('div');
  card.className = 'tool-card loading';
  var argsStr = typeof args === 'string' ? tryFormatJson(args) : JSON.stringify(args, null, 2);

  card.innerHTML =
    '<div class="tc-header">' +
      '<span class="tc-icon spin">&#8942;</span>' +
      '<span class="tc-name">' + escapeHtml(name) + '</span>' +
      '<span class="tc-status executing">executing</span>' +
      '<span class="tc-arrow">&#9654;</span>' +
    '</div>' +
    '<div class="tc-body">' +
      '<div class="tc-body-inner">' +
        '<div class="tc-field">' +
          '<div class="tc-field-label">Parameters</div>' +
          '<div class="tc-field-value">' + escapeHtml(argsStr) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  card.querySelector('.tc-header').addEventListener('click', function() {
    toggleToolCard(card);
  });
  card.querySelector('.tc-body').addEventListener('click', function(e) {
    e.stopPropagation();
  });

  return card;
}

function updateToolCardComplete(card, result) {
  card.classList.remove('loading');
  card.classList.add('completed');

  var header = card.querySelector('.tc-header');
  var icon = header.querySelector('.tc-icon');
  var status = header.querySelector('.tc-status');

  icon.classList.remove('spin');
  icon.textContent = '✓';
  icon.style.color = 'var(--success)';
  status.textContent = 'completed';
  status.className = 'tc-status done';

  var resultStr = typeof result === 'string' ? tryFormatJson(result) : JSON.stringify(result, null, 2);
  var bodyInner = card.querySelector('.tc-body-inner');
  var field = document.createElement('div');
  field.className = 'tc-field';
  field.innerHTML =
    '<div class="tc-field-label">Result</div>' +
    '<div class="tc-field-value">' + escapeHtml(resultStr) + '</div>';
  bodyInner.appendChild(field);

  var body = card.querySelector('.tc-body');
  setTimeout(function() {
    if (body.classList.contains('open')) toggleToolCard(card);
  }, 800);
}

function updateToolCardFailed(card, errorMsg) {
  card.classList.remove('loading');
  card.classList.add('failed');

  var header = card.querySelector('.tc-header');
  var icon = header.querySelector('.tc-icon');
  var status = header.querySelector('.tc-status');

  icon.classList.remove('spin');
  icon.textContent = '✗';
  icon.style.color = 'var(--error)';
  status.textContent = 'failed';
  status.className = 'tc-status fail';

  var bodyInner = card.querySelector('.tc-body-inner');
  var field = document.createElement('div');
  field.className = 'tc-field';
  field.innerHTML =
    '<div class="tc-field-label">Error</div>' +
    '<div class="tc-error-msg">' + escapeHtml(errorMsg) + '</div>';
  bodyInner.appendChild(field);

  var body = card.querySelector('.tc-body');
  if (!body.classList.contains('open')) toggleToolCard(card);
}

function toggleToolCard(card) {
  var body = card.querySelector('.tc-body');
  var arrow = card.querySelector('.tc-arrow');
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    arrow.classList.remove('open');
  } else {
    body.classList.add('open');
    arrow.classList.add('open');
  }
}

// ============================================================================
// Helpers
// ============================================================================
function tryFormatJson(str) {
  try { var p = JSON.parse(str); return JSON.stringify(p, null, 2); }
  catch(e) { return str; }
}

function formatMarkdown(text) {
  var html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

      historyEl.appendChild(udiv);

      adiv.className = 'chat-msg assistant';
      adiv.innerHTML = '<div class="bubble">' + formatMarkdown(m.content || '') + '</div>';
      historyEl.appendChild(adiv);

// ============================================================================
// Upload (unchanged)
// ============================================================================
function handleFileSelect(event) {
  if (event.target.files && event.target.files.length > 0) {
    uploadFiles(event.target.files);
  }
  event.target.value = '';
}

function uploadFiles(fileList) {
  for (var i = 0; i < fileList.length; i++) {
    uploadSingle(fileList[i]);
  }
}

function uploadSingle(file) {
  if (file.size > MAX_UPLOAD_BYTES) {
    attachments.push({
      filename: file.name, size: file.size, error: 'Exceeds 15 MB limit',
      path: '', preview: '',
    });
    renderAttachments();
    return;
  }

  var btn = document.getElementById('btn-upload');
  if (btn) btn.classList.add('uploading');

  var formData = new FormData();
  formData.append('file', file);

  fetch('/api/upload', { method: 'POST', body: formData })
    .then(function(res) {
      if (!res.ok) return res.json().then(function(err) { throw new Error(err.detail || 'Upload failed'); });
      return res.json();
    })
    .then(function(data) {
      attachments.push({
        filename: data.filename, size: data.size, path: data.path,
        preview: data.preview, content_type: data.content_type, error: '',
      });
      renderAttachments();
    })
    .catch(function(e) {
      attachments.push({
        filename: file.name, size: file.size, error: e.message,
        path: '', preview: '',
      });
      renderAttachments();
    })
    .finally(function() {
      if (btn) btn.classList.remove('uploading');
    });
}

function renderAttachments() {
  var container = document.getElementById('attach-tags');
  if (!container) return;
  var html = '';
  for (var i = 0; i < attachments.length; i++) {
    var a = attachments[i];
    var errClass = a.error ? ' error' : '';
    var sizeStr = a.error ? a.error : formatBytes(a.size);
    html +=
      '<div class="attach-tag' + errClass + '">' +
        '<span class="at-name" title="' + escapeHtml(a.filename) + '">' + escapeHtml(a.filename) + '</span>' +
        '<span class="at-size">' + escapeHtml(sizeStr) + '</span>' +
        '<span class="at-remove" onclick="removeAttachment(' + i + ')">&times;</span>' +
      '</div>';
  }
  container.innerHTML = html;
}

function removeAttachment(index) {
  attachments.splice(index, 1);
  renderAttachments();
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function testConnection() {

  })
    .then(function(res) {
      if (!res.ok) return res.json().then(function(err) { throw new Error(err.detail || 'Connection failed'); });
      return res.json();
    })
    .then(function(data) {
      result.className = 'result-ok';
      result.innerHTML = '<strong>Connection OK</strong><br>LLM: ' + escapeHtml(data.response);
      saveBtn.classList.remove('hidden');
    })
    .catch(function(e) {
      result.className = 'result-err';
      result.textContent = 'Error: ' + e.message;
      saveBtn.classList.add('hidden');
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Test Connection';
    });
}

function saveAndContinue() {
  var payload = getConfigPayload();
  fetch('/api/config/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(function(res) {
      if (res.ok) showMainLayout({ model_name: payload.model_name });
      else alert('Save failed');
    });
}

function getConfigPayload() {
  return {
    base_url: document.getElementById('cfg-base-url').value.trim(),
    api_key: document.getElementById('cfg-api-key').value.trim(),
    model_name: document.getElementById('cfg-model-name').value.trim(),
    temperature: parseFloat(document.getElementById('cfg-temp').value) || 0.7,
    max_tokens: parseInt(document.getElementById('cfg-max-tokens').value) || 4096,
  };
}
</script>
