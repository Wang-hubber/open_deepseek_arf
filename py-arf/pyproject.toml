[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "arf"
version = "1.0.0-alpha.0"
description = "ARF V1.x — AI Resources & Runtime Framework"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "arf._arf"
