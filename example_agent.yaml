# ============================================================================
# § Eval Benchmark (docs/eval-benchmark.md)
# 审计日期: 2026-05-29 | 测试: 89 existing + 5 new = 94 total
# ============================================================================

# Eval 模块无需 agent.yaml 配置，在 arf/evaluation/ 下自动可用。
# Benchmark 和 report 的存储路径由 App 层决定：
#   benchmarks/{name}.json  → 用户创建和编辑的 benchmark JSON
#   reports/{name}.json     → runner 输出的 report JSON
#   memory/traces/          → FileTraceStore 写入的真实对话 trace 数据源

# --- 注意事项 ---
# BenchmarkBuilder.build() 只自动提取 expected_tools，不填充 expected_output_contains。
# 输出关键词需用户在生成的 JSON 中手动补充。
# max_parallel 已从协议和实现中移除（详见 docs/eval-benchmark.md §7 演进方向）。

