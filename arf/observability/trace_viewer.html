<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARF Trace Viewer</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e;
  --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d2991d; --purple:#bc8cff; --pink:#f778ba; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font:14px/1.5 'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:20px; }
.header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.header h1 { font-size:20px; color:var(--blue); }
input,button,select { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-size:13px; }
button { cursor:pointer; }
button:hover { background:#1f2937; }
.stats { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 16px; }
.stat .v { font-size:22px; font-weight:700; }
.stat .l { font-size:11px; color:var(--muted); }
.round { background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden; }
.round-header { display:flex; align-items:center; padding:10px 14px; cursor:pointer; gap:10px; user-select:none; }
.round-header:hover { background:#1a1f2b; }
.round-header .arrow { transition:transform .2s; width:14px; text-align:center; font-size:10px; }
.round-header .arrow.open { transform:rotate(90deg); }
.round-num { font-weight:700; color:var(--blue); min-width:50px; }
.round-summary { color:var(--muted); font-size:12px; flex:1; }
.round-body { display:none; border-top:1px solid var(--border); }
.round-body.open { display:block; }
.turn { padding:8px 14px 8px 40px; border-bottom:1px solid var(--border); cursor:pointer; }
.turn:last-child { border-bottom:none; }
.turn:hover { background:#1a1f2b; }
.turn-header { display:flex; gap:10px; align-items:center; }
.turn-detail { display:none; padding:8px 14px 8px 50px; font-size:12px; }
.turn-detail.open { display:block; }
.event-tag { font-size:11px; padding:1px 6px; border-radius:4px; white-space:nowrap; }
.tag-model { background:#1a3a5c; color:var(--blue); }
.tag-tool { background:#1a3c1a; color:var(--green); }
.tag-hook { background:#2a1a3c; color:var(--purple); }
.tag-error { background:#3c1a1a; color:var(--red); }
.tag-compact { background:#3c2a0a; color:var(--yellow); }
.tag-system { background:#3c1a2c; color:var(--pink); }
.chip { display:inline-flex; align-items:center; gap:4px; margin:2px 3px; }
.panel { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:8px 12px; margin:4px 0; font-family:'SF Mono',monospace; font-size:12px; max-height:240px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; }
.empty { text-align:center; padding:60px; color:var(--muted); }
.time-input { width:180px; }
</style>
</head>
<body>
<div class="header">
  <h1>ARF Trace Viewer</h1>
  <input type="file" id="filePicker" accept=".json" title="Load trace JSON file">
  <input type="text" id="urlInput" placeholder="Or paste trace API URL..." style="width:360px;">
  <button onclick="loadUrl()">Load</button>
  <span style="color:var(--muted);font-size:12px;">Try: /api/traces/sessions/default</span>
</div>

<div class="stats" id="stats"></div>

<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">
  <input type="datetime-local" id="timeFrom" class="time-input" title="From">
  <span style="color:var(--muted);">→</span>
  <input type="datetime-local" id="timeTo" class="time-input" title="To">
  <button onclick="applyFilter()">Filter by time</button>
  <button onclick="clearFilter()" style="color:var(--muted);">Clear</button>
  <button onclick="expandAll()">Expand all</button>
  <button onclick="collapseAll()">Collapse all</button>
  <span id="filterInfo" style="color:var(--muted);font-size:12px;"></span>
</div>

<div id="content"><div class="empty">Load a trace JSON file or API URL to begin</div></div>

<script>
const TAG = { model_call_start:'tag-model',model_call_end:'tag-model',thinking_delta:'tag-model',
  tool_call_start:'tag-tool',tool_call_end:'tag-tool',
  hook_start:'tag-hook',hook_end:'tag-hook',
  compaction_start:'tag-compact',compaction_end:'tag-compact',
  session_start:'tag-system',session_end:'tag-system',user_input:'tag-system',
  error:'tag-error' };

const ICON = { model_call_start:'🤖',model_call_end:'🤖',thinking_delta:'💭',
  tool_call_start:'🔧',tool_call_end:'🔧', hook_start:'🪝',hook_end:'🪝',
  compaction_start:'📦',compaction_end:'📦',
  session_start:'▶',session_end:'⏹',user_input:'👤',error:'❌' };

let allEvents = [], groupedRounds = [];

document.getElementById('filePicker').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { process(JSON.parse(r.result)); };
  r.readAsText(f);
});

document.getElementById('timeFrom').addEventListener('change', applyFilter);
document.getElementById('timeTo').addEventListener('change', applyFilter);

const DEFAULT_DATA_URL = '/api/traces/sessions/default';

async function loadUrl(silent) {
  const url = document.getElementById('urlInput').value.trim();
  if(!url) return;
  await fetchAndProcess(url, silent);
}

async function fetchAndProcess(url, silent) {
  try {
    const resp = await fetch(url);
    const data = await resp.json();
    const events = data.events || data.turns?.flatMap(t => t.events) || data;
    process(Array.isArray(events) ? events : []);
  } catch(e) { if(!silent) alert('Failed to load: ' + e.message); }
}

// Auto-load from query param or default API when served from same origin
(function autoLoad() {
  const params = new URLSearchParams(location.search);
  const dataUrl = params.get('data') || (location.hostname !== '' ? DEFAULT_DATA_URL : null);
  if (dataUrl) {
    document.getElementById('urlInput').value = dataUrl;
    fetchAndProcess(dataUrl, true);
  }
})();

function process(events) {
  allEvents = events.sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
  render();
}

function groupByRound(events) {
  const groups = {};
  for(const e of events) {
    const r = e.data?.round ?? e.round ?? 0;
    if(!groups[r]) groups[r] = [];
    groups[r].push(e);
  }
  return Object.entries(groups).sort((a,b) => +a[0] - +b[0]);
}

function renderStats(events) {
  const models = {}, tools = {};
  let tokens = 0, errors = 0;
  for(const e of events) {
    if(e.type === 'model_call_end') {
      const m = e.data?.model || '?';
      models[m] = (models[m]||0) + 1;
      tokens += e.data?.usage?.total_tokens || 0;
    }
    if(e.type === 'tool_call_start') tools[e.data?.tool_name||'?'] = (tools[e.data?.tool_name||'?']||0) + 1;
    if(e.type === 'error') errors++;
  }
  return { models, tools, tokens, errors, total: events.length };
}

function render() {
  const tsFrom = document.getElementById('timeFrom').value;
  const tsTo = document.getElementById('timeTo').value;
  let events = allEvents;
  if(tsFrom) { const t = new Date(tsFrom).getTime()/1000; events = events.filter(e => (e.timestamp||0) >= t); }
  if(tsTo) { const t = new Date(tsTo).getTime()/1000; events = events.filter(e => (e.timestamp||0) <= t); }

  const s = renderStats(events);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="v">${s.total}</div><div class="l">Events</div></div>
    <div class="stat"><div class="v">${Object.keys(groupByRound(events)).length}</div><div class="l">Rounds</div></div>
    <div class="stat"><div class="v">${(s.tokens/1000).toFixed(1)}k</div><div class="l">Tokens</div></div>
    <div class="stat"><div class="v">${s.errors}</div><div class="l">Errors</div></div>
    ${Object.entries(s.models).map(([m,c]) => `<div class="stat"><div class="v">${c}</div><div class="l">${m}</div></div>`).join('')}
    ${Object.entries(s.tools).slice(0,6).map(([t,c]) => `<div class="stat"><div class="v">${c}</div><div class="l">${t}</div></div>`).join('')}
  `;

  groupedRounds = groupByRound(events);
  if(!groupedRounds.length) {
    document.getElementById('content').innerHTML = '<div class="empty">No events match</div>';
    return;
  }

  document.getElementById('content').innerHTML = groupedRounds.map(([round, evts]) => {
    const st = renderStats(evts);
    const turns = groupByTurn(evts);
    return `<div class="round" data-round="${round}">
      <div class="round-header" onclick="toggleRound(this)">
        <span class="arrow">▶</span>
        <span class="round-num">Round ${round}</span>
        <span class="round-summary">${Object.values(st.models).reduce((a,b)=>a+b,0)} model calls · ${st.total} events · ${(st.tokens/1000).toFixed(1)}k tokens</span>
      </div>
      <div class="round-body">${turns.map(([turn, tevs]) => renderTurn(turn, tevs)).join('')}</div>
    </div>`;
  }).join('');
}

function groupByTurn(events) {
  const groups = {};
  for(const e of events) {
    const t = e.turn || 0;
    if(!groups[t]) groups[t] = [];
    groups[t].push(e);
  }
  return Object.entries(groups).sort((a,b) => +a[0] - +b[0]);
}

function renderTurn(turn, events) {
  const types = [...new Set(events.map(e => e.type))];
  const tags = types.map(t => `<span class="event-tag ${TAG[t]||''}">${ICON[t]||''} ${t}</span>`).join(' ');
  const first = events[0];
  const time = first?.timestamp ? new Date(first.timestamp*1000).toLocaleTimeString() : '';
  return `<div class="turn" data-turn="${turn}">
    <div class="turn-header" onclick="toggleTurn(this)">
      <span class="arrow">▶</span>
      <span style="color:var(--muted);">T${turn}</span>
      <span style="font-size:11px;color:var(--muted);">${time}</span>
      ${tags}
    </div>
    <div class="turn-detail">${renderTurnDetail(events)}</div>
  </div>`;
}

function renderTurnDetail(events) {
  return events.map(e => {
    const d = e.data || {};
    const ts = e.timestamp ? new Date(e.timestamp*1000).toISOString().slice(11,23) : '';
    let body = '';
    if(e.type === 'model_call_end') {
      body = `model=${d.model||'?'} tokens=${JSON.stringify(d.usage||{})} content=${(d.content||'').slice(0,300)}`;
    } else if(e.type === 'tool_call_end') {
      body = `success=${d.success} duration=${d.duration_ms||0}ms result=${(d.result||'').slice(0,600)} error=${d.error||''}`;
    } else if(e.type === 'tool_call_start') {
      body = `tool=${d.tool_name||'?'} args=${(d.arguments||'{}').slice(0,300)}`;
    } else if(e.type === 'error') {
      body = `${d.detail||d.message||JSON.stringify(d)}`;
    } else if(e.type === 'thinking_delta') {
      body = (d.reasoning||d.content||'').slice(0,500);
    } else {
      body = JSON.stringify(d).slice(0,400);
    }
    return `<div class="chip"><span class="event-tag ${TAG[e.type]||''}">${ICON[e.type]||''} ${e.type}</span></div>
      <span style="color:var(--muted);font-size:11px;">${ts}</span>
      ${body ? `<div class="panel">${esc(body)}</div>` : ''}`;
  }).join('');
}

function toggleRound(el) {
  const body = el.nextElementSibling;
  const open = body.classList.toggle('open');
  el.querySelector('.arrow').classList.toggle('open', open);
}

function toggleTurn(el) {
  const detail = el.nextElementSibling;
  const open = detail.classList.toggle('open');
  el.querySelector('.arrow').classList.toggle('open', open);
}

function expandAll() {
  document.querySelectorAll('.round-body').forEach(b => { b.classList.add('open'); });
  document.querySelectorAll('.turn-detail').forEach(b => { b.classList.add('open'); });
  document.querySelectorAll('.arrow').forEach(a => { a.classList.add('open'); });
}

function collapseAll() {
  document.querySelectorAll('.round-body,.turn-detail').forEach(b => { b.classList.remove('open'); });
  document.querySelectorAll('.arrow').forEach(a => { a.classList.remove('open'); });
}

function applyFilter() { render(); }

function clearFilter() {
  document.getElementById('timeFrom').value = '';
  document.getElementById('timeTo').value = '';
  process(allEvents);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
