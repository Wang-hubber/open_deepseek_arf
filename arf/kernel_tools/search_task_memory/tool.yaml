name: kernel__search_task_memory
description: >
  Search past task experience for relevant approaches and pitfalls. Use
  this to learn from previous similar tasks before starting new work.
  Provide a query describing what you want to learn about.
parameters:
  type: object
  properties:
    query:
      type: string
      description: What kind of past experience to search for (e.g. 'auth module refactoring', 'redis connection timeout').
  required: [query]
activation: kernel
