name: send_peer_message
description: >
  Send a message to a PERSISTENT teammate (part of your team for the
  entire session). The target is identified by session_id (e.g.
  "default_group__dev"). Find session_ids in the roster at session start.
  Messages are delivered to the receiver's inbox and injected before
  their next model call.

  DO NOT use this for one-off tasks that don't need a persistent
  teammate. Use delegate_task for throwaway sub-agents instead.
  send_peer_message = teammate. delegate_task = temporary worker.
parameters:
  type: object
  properties:
    to:
      type: string
      description: "Target agent's session_id (e.g. default_group__dev)."
    message:
      type: string
      description: "Message content."
    type:
      type: string
      description: "Message type: task (assign work) or info (notify)."
      default: task
    priority:
      type: string
      description: "Delivery priority: normal (next turn) or urgent (interrupt)."
      default: normal
  required:
    - to
    - message
execution:
  sandbox: none
  timeout: 20s
activation: kernel
