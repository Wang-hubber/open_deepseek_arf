name: send_peer_message
description: >
  Send a message to another peer agent. The target is identified by session_id
  (e.g. "default_group__dev"). You can find your teammates' session_ids in the
  roster shown at session start. Messages are delivered to the receiver's inbox
  and injected before their next model call.
parameters:
  type: object
  properties:
    to:
      type: string
      description: "Target agent's session_id (e.g. default_group__dev)."
    message:
      type: string
      description: "Message content."
    type:
      type: string
      description: "Message type: task (assign work) or info (notify)."
      default: task
    priority:
      type: string
      description: "Delivery priority: normal (next turn) or urgent (interrupt)."
      default: normal
  required:
    - to
    - message
execution:
  sandbox: none
  timeout: 20s
activation: kernel
