name: cancel_peer_task
description: >
  Cancel a previously sent peer task. Sends a cancel message to the
  receiver and wakes them if they are parked. Use when the user changes
  requirements or wants to reassign work.
parameters:
  type: object
  properties:
    correlation_id:
      type: string
      description: "The correlation_id returned by send_peer_message."
  required:
    - correlation_id
execution:
  sandbox: none
  timeout: 10s
activation: kernel
