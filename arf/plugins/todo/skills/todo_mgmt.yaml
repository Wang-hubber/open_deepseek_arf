name: todo_mgmt
description: Task list management — track and update progress on multi-step tasks
prompt: |
  # Task Management

  Use the `todo` tool to track work through its lifecycle:

  ## Actions
  - **create**: Add a new task. Use `subject` (required) + optional `description` and `metadata`.
  - **update**: Change `status` (pending → in_progress → completed) or add dependencies (`addBlockedBy`, `addBlocks`).
  - **get**: View full details of one task including its dependencies.
  - **list**: Show summary of all active tasks. Use `filter_status` to narrow down.
  - **delete**: Remove a completed or pending task that is no longer needed.

  ## Workflow
  1. Before starting: `todo(action="list")` to see what's pending.
  2. When starting work: `todo(action="update", id="...", status="in_progress")`.
  3. When done: `todo(action="update", id="...", status="completed")`.
  4. When blocked: `todo(action="update", id="...", addBlockedBy=["<dep-id>"])`.

  Keep the todo list honest — it reflects actual progress, not wishful thinking.
tools:
  - todo
activation: kernel
