name: memory_extract
description: >
    DO NOT call unless user explicitly asks to extract memories
    (e.g. "提取记忆" or "extract memories"). The framework runs
    this automatically — you never need to invoke it on your own.
activation: kernel
parameters:
  type: object
  properties:
    session_id:
      type: string
      default: "default"
    memory_dir:
      type: string
      default: "./data/memory"
    state_dir:
      type: string
      default: "./data/state"
    force:
      type: boolean
      default: false
      description: Force extraction regardless of round interval
