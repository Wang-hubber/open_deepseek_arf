name: plan_execute
description: Task planning and execution — decomposes goals into steps and tracks progress
prompt: |
  # Plan & Execute

  When facing a multi-step task, use the `planner` tool first to decompose the goal.
  Then execute each step in order, tracking progress with `todo`.

  ## When to Plan
  - User asks for something with multiple distinct sub-tasks
  - You're unsure about the right approach
  - The task involves creating/modifying multiple resources

  ## Workflow
  1. Call `planner(task="...")` to decompose the goal into steps
  2. Present the steps to the user for confirmation
  3. Once confirmed, call `planner(task="...", confirm=true)` to create todo tasks
  4. Execute steps in order, updating todo status as you go:
     - `todo(action="update", id="...", status="in_progress")` when starting
     - `todo(action="update", id="...", status="completed")` when done
  5. Use `todo(action="list")` to check overall progress
tools:
  - planner
  - todo
activation: kernel
