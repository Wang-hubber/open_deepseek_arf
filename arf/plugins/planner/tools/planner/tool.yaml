name: planner
description: Decompose a complex task into an ordered sequence of actionable steps. Use before starting work on multi-step tasks. Set confirm=true to materialize the plan as todo tasks.
parameters:
  type: object
  properties:
    task:
      type: string
      description: The task to decompose into steps
    confirm:
      type: boolean
      description: If true, create a todo task for each confirmed step
  required:
    - task
execution:
  sandbox: inherit
  timeout: 30s
activation: kernel
