name: plan_solve
description: Task planning and execution with dependency tracking — decompose, dispatch, and summarize
prompt: |
  # Plan & Solve

  When facing a multi-step task, use the plan_solve tools to decompose, dispatch, and summarize.

  ## When to Use
  - Task requires 3+ distinct steps with dependencies
  - Steps can be isolated and executed independently
  - You need progress tracking and resumability

  ## Workflow
  1. Call `plan_create(task="...", steps=[...])` to decompose
     - Each step: {index, description, tool_hint, depends_on, blocks}
     - depends_on: steps that must finish before this one
     - blocks: steps this one will unlock when done
  2. Call `plan_dispatch(step_index=N)` for each ready step
     - Framework enforces dependency order
     - If blocked, you'll get the reason — adjust or wait
  3. Call `plan_status()` anytime to check progress
  4. After all steps done/failed, call `plan_summarize()` for final output

  ## Tips
  - Steps without mutual dependencies can be dispatched in parallel
  - If dispatch fails with an error, read it and decide: retry, skip, or replan
tools:
  - plan_create
  - plan_dispatch
  - plan_summarize
  - plan_status
activation: kernel
