name: trace
hooks:
  - session_start
  - session_end
  - round_start
  - round_end
  - turn_start
  - turn_end
  - pre_action
  - post_action
  - error
enabled: true
config:
  trace_dir: ./data/traces
  plugins_root: ./arf/plugins
  config_files:
    - ./agent.yaml
    - ./pyproject.toml
  extra_roots:
    - .
