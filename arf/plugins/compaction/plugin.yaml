name: compaction
events:
  - {hook_name: "before_model", event_name: "compact", mode: "blocking"}
  - {hook_name: "after_tools", event_name: "tool_output", mode: "blocking"}
config:
  threshold: 0.75
  window_size: 131072
  keep_count: 8
  truncation:
    l1_threshold: 0.50
    l2_threshold: 0.70
    preview_chars: 100
    window_ratio: 0.15
