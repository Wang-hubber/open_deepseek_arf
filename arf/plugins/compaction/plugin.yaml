name: compaction
enabled: true
description: "Progressive context compaction — truncation, summarization, tool output externalization"
tools:
  - compact_now
skills:
  - summarizer
hooks:
  round_end: blocking
  tool_output: blocking
config:
  threshold: 0.75
  window_size: 131072
  keep_count: 8
  truncation:
    l1_threshold: 0.50
    l2_threshold: 0.70
    preview_chars: 100
    window_ratio: 0.15
