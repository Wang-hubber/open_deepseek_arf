name: grep
description: Search for a regex pattern in files under a directory. Returns matching lines with file paths and line numbers.
parameters:
  type: object
  properties:
    pattern:
      type: string
      description: Regular expression to search for
    path:
      type: string
      description: Directory to search in (default workspace root)
    include:
      type: string
      description: Comma-separated file glob patterns to include (e.g. "*.py,*.yaml")
    exclude:
      type: string
      description: Comma-separated file glob patterns to exclude (e.g. "*.pyc,__pycache__")
    max_results:
      type: integer
      description: Maximum number of results (default 50)
  required:
    - pattern
execution:
  sandbox: inherit
  timeout: 30s
activation: kernel
