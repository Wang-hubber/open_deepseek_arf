name: eval
hooks: []  # offline, not hook-mounted
enabled: true
config:
  trace_dir: ./data/traces
  eval_dir: ./data/eval
  system_prompt: ""
  tools: ""
  judge:
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4
    temperature: 0.0
    max_tokens: 2000
    system_prompt: >
      You are an expert evaluator for AI agent behavior. Your role is to
      compare an agent's actual output against a reference (golden) standard.
      You are impartial, precise, and consistent. Ground every judgment in the
      specific content provided — never speculate about missing information,
      and clearly state when a comparison cannot be reliably made.
      Every evaluation must be reproducible: another evaluator reading your
      reasoning should arrive at the same conclusion.
      Always respond with valid JSON only, no markdown fences or extra text.
  prompts:
    tool_call_result_llm: |
      You are comparing the output of a tool call against the expected reference output.

      User's original request: {user_input}

      Tool: {tool_name}
      Expected output:
      <<<EXPECTED>>>
      {expected}
      <<<END>>>

      Actual output:
      <<<ACTUAL>>>
      {actual}
      <<<END>>>

      Determine whether the actual output is **semantically equivalent** to the expected output. Semantic equivalence means: both outputs convey the same functional information — they would lead the agent to the same next decision or action, even if wording, formatting, or verbosity differ.

      Judgment criteria:
      - true : Core information is preserved. Minor formatting differences, extra details that do not change meaning, or different phrasing of the same facts are all acceptable.
      - false: Critical information is missing, contradictory facts are present, or the actual output is an error/failure while the expected was successful.

      Edge cases:
      - If either output appears truncated, judge based on the available content.
      - If the actual output is an error/failure but the expected was successful, this is unequivocally false.
      - If both are errors/failures of the same type, they are equivalent (true).
      - Numeric values: treat ±5% deviation as equivalent unless precision is clearly critical to the user's request.
      - If the actual output contains the expected output verbatim plus extra surrounding context, it is still equivalent.

      Respond with ONLY a JSON object (no markdown fences, no extra text):
      {{"match": <bool>, "reason": "<2-3 sentences explaining the key similarities or differences that determined your judgment>"}}
    output_quality: |
      You are evaluating the quality of an AI agent's final answer against a golden reference answer.

      User's original request: {user_input}

      Golden reference answer:
      <<<GOLDEN>>>
      {golden}
      <<<END>>>

      Actual answer:
      <<<ACTUAL>>>
      {actual}
      <<<END>>>

      Rate the actual answer on a 1–5 scale. The goal is NOT verbatim matching — a differently worded answer that serves the user equally well should score high. Conversely, a verbatim copy that misses the user's intent should score low.

      Scoring rubric (anchor on the behavioral description, not the label):
      5 — Excellent: Effectively addresses the user's request. Factually correct, complete, clear, and well-structured. A user would be fully satisfied.
      4 — Good: Addresses the request but has minor flaws — slightly incomplete, mildly verbose, or missing a secondary detail. Still clearly useful.
      3 — Adequate: Partially addresses the request. Contains some correct information but has notable omissions, unclear phrasing, or minor factual issues. A user would need to ask follow-up questions.
      2 — Poor: Mostly incorrect, irrelevant, or so incomplete that the core request is not meaningfully answered. A user would reject this answer.
      1 — Wrong/Harmful: Completely incorrect, contradicts the golden answer on key facts, or provides dangerously misleading information.

      Important distinctions:
      - Factual errors are worse than stylistic issues (verbose but correct should not drop below 4).
      - An answer that is correct but less detailed than the golden answer may still score 4 if the essentials are there.
      - An answer that adds genuinely useful context beyond the golden answer should NOT be penalized — it can still score 5.
      - If both answers are functionally identical but phrased differently, score 5.

      Respond with ONLY a JSON object (no markdown fences, no extra text):
      {{"score": <int 1-5>, "reason": "<2-3 sentences justifying the score with specific reference to what the actual answer did well or poorly>"}}
    trajectory_similarity: |
      You are evaluating whether an AI agent followed a correct procedure to fulfill the user's request.

      User's original request: {user_input}

      Golden trajectory (reference procedure):
      <<<GOLDEN>>>
      {golden}
      <<<END>>>

      Actual trajectory (what the agent did):
      <<<ACTUAL>>>
      {actual}
      <<<END>>>

      The golden trajectory is ONE correct way to solve the problem, not the ONLY correct way. The agent may take a different but equally valid path.

      Trajectory format: each entry represents a turn with [turn N] prefixes. Entries show tool calls (call <name>), tool results (result: ok/fail), and model outputs (output: <text>).

      Rate the actual trajectory on a 1–5 scale:
      5 — Excellent match: Uses the same key tools/steps in a logical order to achieve the goal. Minor variations (extra benign calls, slightly different order for independent steps) are acceptable.
      4 — Good match: Core approach is correct. Differs in some tool choices or order, but still reaches the goal competently.
      3 — Partial match: Some correct steps but missing critical tool calls, wrong order for dependent steps, or includes clearly unnecessary detours.
      2 — Poor match: The approach is largely wrong. Key tools are missing or misused. The agent seems to be guessing or going in circles.
      1 — No match: Completely wrong approach, irrelevant tool calls, or the trajectory fails to address the user's request at all.

      Weighting guidelines:
      - Using the right tools matters more than using them in the exact same order (unless the order reflects a hard dependency).
      - Extra benign tool calls that don't affect the outcome should not significantly lower the score.
      - Missing a critical tool that is essential to the solution should drop the score by at least 2 points.
      - If the actual trajectory achieves the same result through a genuinely different but equally sound approach, score 5.

      Respond with ONLY a JSON object (no markdown fences, no extra text):
      {{"score": <int 1-5>, "reason": "<2-3 sentences justifying the score with specific reference to which steps matched or diverged>"}}
    output_quality_free: |
      You are evaluating the quality of an AI agent's final answer.
      You do NOT have a golden reference — evaluate the answer on its own merits.

      Agent system prompt: {system_prompt}
      Available tools and descriptions: {tools}

      User's original request: {user_input}

      Agent's final answer:
      <<<ANSWER>>>
      {actual}
      <<<END>>>

      Rate the answer on a 1–5 scale. The answer should be judged against what a reasonable agent with these instructions and tools SHOULD produce.

      Scoring rubric:
      5 — Excellent: Fully addresses the user's request. Correct, complete, well-structured, and aligned with the system prompt's constraints. If the system prompt limits behavior (e.g., brevity), compliance with that constraint IS quality.
      4 — Good: Addresses the core request but has minor flaws — slightly incomplete, mildly verbose, or missing a secondary detail.
      3 — Adequate: Partially addresses the request. Notable omissions or unclear phrasing. A user would need follow-up questions.
      2 — Poor: Mostly does not address the request. Key information missing or wrong. A user would reject this answer.
      1 — Wrong/Harmful: Completely irrelevant, contradicts the user's request, or violates explicit system prompt prohibitions.

      Critical rules:
      - If the system prompt explicitly restricts behavior (format, length, content), compliance with those restrictions is REQUIRED for a high score. A brief answer that follows instructions is NOT a flaw — the constraint IS the expected behavior.
      - If system prompt or tools fields are empty, you are missing key context — note this in your reason and judge conservatively.

      Respond with ONLY a JSON object (no markdown fences, no extra text):
      {{"score": <int 1-5>, "reason": "<2-3 sentences>"}}
    trajectory_similarity_free: |
      You are evaluating whether an AI agent followed a reasonable procedure to fulfill the user's request. You do NOT have a golden trajectory — evaluate the actual steps on their own merits.

      Agent system prompt: {system_prompt}
      Available tools and descriptions: {tools}

      User's original request: {user_input}

      Agent's actual trajectory:
      <<<TRAJECTORY>>>
      {actual}
      <<<END>>>

      Trajectory format: each entry shows [turn N] with tool calls (call <name>), results (result: ok/fail), and outputs (output: <text>).

      Rate the trajectory on a 1–5 scale:
      5 — Excellent: Efficient, logical sequence. Uses the most appropriate tools from the available set. No unnecessary steps. If the system prompt constrains behavior, follows it precisely.
      4 — Good: Reasonable approach. Minor inefficiency or a slightly suboptimal tool choice, but still achieves the goal well.
      3 — Adequate: Gets the job done but with unnecessary detours, repeated calls, or clearly suboptimal tools given the available set.
      2 — Poor: Significant issues — wrong tools, confused backtracking, or failing to make meaningful progress toward the goal.
      1 — Wrong: Inappropriate approach. Tool choices are irrelevant to the request. The agent seems to be guessing or ignoring the user.

      Weighting guidelines:
      - Tool choice should be evaluated against the AVAILABLE tools listed above, not against an ideal unlimited tool set. If the right tool doesn't exist, judge whether the agent made the best of what it had.
      - System prompt constraints are EXPECTED behavior. If told to never use a certain tool, using it is a flaw regardless of effectiveness.
      - Extra benign steps that show exploration but don't derail the task should not significantly lower the score.
      - If system prompt or tools fields are empty, you are missing key context — note this in your reason and judge conservatively.

      Respond with ONLY a JSON object (no markdown fences, no extra text):
      {{"score": <int 1-5>, "reason": "<2-3 sentences>"}}
