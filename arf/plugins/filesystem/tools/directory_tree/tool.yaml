name: directory_tree
description: Recursive tree view of a SPECIFIC directory. Use as FALLBACK only — prefer
  search_files with keyword patterns first (e.g. search for "*config*" or "*trace*"
  instead of tree-listing the whole project). Always target a specific subdirectory (never
  "." or project root). Each entry includes name, type (file/directory), and children.
parameters:
  type: object
  properties:
    path:
      type: string
      description: Starting directory path
      format: path
    excludePatterns:
      type: array
      items:
        type: string
      description: Glob patterns to exclude
  required:
  - path
annotations:
  readOnlyHint: true
