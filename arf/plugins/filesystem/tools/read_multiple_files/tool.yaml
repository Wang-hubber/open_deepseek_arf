name: read_multiple_files
description: Read the contents of multiple files simultaneously. Each file's content
  is returned with its path as reference. Failed reads for individual files won't
  stop the entire operation.
parameters:
  type: object
  properties:
    paths:
      type: array
      items:
        type: string
      description: Array of file paths to read
      minItems: 1
      format: path
    encoding:
      type: string
      description: Text encoding (default utf-8). Use gbk for older Chinese files
        from Notepad, gb2312 for simplified Chinese, shift_jis for Japanese, etc.
      default: utf-8
  required:
  - paths
annotations:
  readOnlyHint: true
