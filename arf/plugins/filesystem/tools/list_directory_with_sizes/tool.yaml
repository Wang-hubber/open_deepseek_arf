name: list_directory_with_sizes
description: Get a detailed listing including file sizes. Results distinguish between
  files and directories with [FILE] and [DIR] prefixes. Includes summary with total
  files, directories, and combined size.
parameters:
  type: object
  properties:
    path:
      type: string
      description: Directory path to list
      format: path
    sortBy:
      type: string
      enum:
      - name
      - size
      description: Sort entries by name or size
      default: name
  required:
  - path
annotations:
  readOnlyHint: true
