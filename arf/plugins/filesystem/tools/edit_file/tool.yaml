name: edit_file
description: Make selective line-based edits to a text file. Each edit replaces exact text sequences with new content. Returns a git-style diff showing the changes made. Use dryRun=true to preview changes without applying them.
parameters:
  type: object
  properties:
    path:
      type: string
      description: File to edit
    edits:
      type: array
      items:
        type: object
        properties:
          oldText:
            type: string
            description: Text to search for — can be exact or whitespace-flexible match
          newText:
            type: string
            description: Replacement text
        required:
          - oldText
          - newText
      description: List of edit operations
    dryRun:
      type: boolean
      description: Preview changes using git-style diff without applying
      default: false
  required:
    - path
    - edits
annotations:
  readOnlyHint: false
  idempotentHint: false
  destructiveHint: true
