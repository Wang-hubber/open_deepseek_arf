name: search_content
description: PREFERRED content-discovery tool. Search file CONTENTS for text or regex
  patterns. Use keywords from the task (agent name, function names, config keys) to
  find relevant files fast. Supports literal text and regex modes. Respects include/
  exclude glob patterns to narrow scope.
parameters:
  type: object
  properties:
    pattern:
      type: string
      description: Text or regex pattern to search for
    path:
      type: string
      format: path
      description: Directory path to search in
    regex:
      type: boolean
      description: "Treat pattern as regex (default: false — literal text search)"
      default: false
    include:
      type: string
      description: Comma-separated glob patterns to filter files (e.g. "*.py,*.md")
    excludePatterns:
      type: array
      items:
        type: string
      description: Glob patterns to exclude from search
    maxResults:
      type: integer
      description: Maximum results to return
      default: 100
  required:
    - pattern
    - path
annotations:
  readOnlyHint: true
