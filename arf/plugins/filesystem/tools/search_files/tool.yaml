name: search_files
description: Recursively search for files and directories matching a glob pattern. Use patterns like '*.ext' to match files in current directory, and '**/*.ext' to match files in all subdirectories. Returns full paths to all matching items.
parameters:
  type: object
  properties:
    path:
      type: string
      description: Starting directory for search
    pattern:
      type: string
      description: Glob-style search pattern
    excludePatterns:
      type: array
      items:
        type: string
      description: Glob patterns to exclude from results
  required:
    - path
    - pattern
annotations:
  readOnlyHint: true
