name: search_files
description: PREFERRED exploration tool. Search for files/directories by name with glob
  patterns. Use keywords from the task: "*agent_name*" to find configs, "*trace*" for
  trace dirs, "*.yaml" for configs. Much faster and lighter than directory_tree. Use
  '**/*.ext' to search all subdirectories. Returns full paths to all matching items.
parameters:
  type: object
  properties:
    path:
      type: string
      description: Starting directory for search
      format: path
    pattern:
      type: string
      description: Glob-style search pattern
    excludePatterns:
      type: array
      items:
        type: string
      description: Glob patterns to exclude from results
  required:
  - path
  - pattern
annotations:
  readOnlyHint: true
