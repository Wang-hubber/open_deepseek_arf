name: filesystem
description: Cross-platform filesystem operations — read, write, edit, search, list directories
prompt: |
  # Filesystem Tools

  Use these tools for all file operations. Prefer them over shell commands.

  Read operations: `read_text_file` (text), `read_media_file` (images/audio), `read_multiple_files` (batch read)
  List operations: `list_directory`, `list_directory_with_sizes`, `directory_tree`
  Search: `search_files` to find files by glob pattern
  Write operations: `write_file` (create/overwrite), `edit_file` (selective edit with diff preview), `create_directory`
  File management: `move_file` (move/rename), `delete_file` (delete files/dirs)
  Info: `get_file_info` (metadata), `list_allowed_directories` (accessible paths)
tools:
  - read_text_file
  - read_media_file
  - read_multiple_files
  - list_directory
  - list_directory_with_sizes
  - directory_tree
  - search_files
  - get_file_info
  - list_allowed_directories
  - write_file
  - create_directory
  - move_file
  - delete_file
  - edit_file
activation: kernel
