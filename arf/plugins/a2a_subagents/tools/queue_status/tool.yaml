name: queue_status
description: >
  Query the status of all delegated tasks in this session.
  Returns lists of running, queued, and (unconsumed) completed tasks.

  IMPORTANT: Only call this tool when the user explicitly asks for task
  status or progress. Do NOT poll proactively — dispatched sub-agent
  results are auto-injected when ready.
parameters:
  type: object
  properties: {}
execution:
  sandbox: none
  timeout: 10s
activation: kernel
