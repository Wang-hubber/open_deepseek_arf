name: delegate_task
description: >
  Dispatch a task to a TEMPORARY sub-agent (one-off, short-lived).
  If 'agent' is specified, the named pre-configured agent handles it.
  Otherwise a temporary agent inherits your model and tools.

  IMPORTANT: This is a TERMINAL action — the round ends immediately
  after dispatch. Results are auto-injected when the sub-agent finishes.
  Do NOT poll queue_status. Do NOT make additional calls in this round.

  DO NOT use this for persistent team members. If you have teammates
  listed in your system prompt, use send_peer_message instead.
  delegate_task = throwaway worker. send_peer_message = teammate.
parameters:
  type: object
  properties:
    agent:
      type: string
      description: "Name of a pre-configured agent (optional). Empty = temporary agent inheriting parent capabilities."
    task:
      type: string
      description: "Task description for the sub-agent."
    timeout:
      type: integer
      description: "Expected completion time in seconds (capped by framework max_task_timeout)."
    context:
      type: object
      description: "Optional context data to pass to the sub-agent."
  required:
    - task
execution:
  sandbox: none
  timeout: 30s
activation: kernel
